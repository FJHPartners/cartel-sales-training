/* ============ MODULE 4 — DRILL DECK ============ */
var DRILLS={
en:[
 {o:"\"It's too much / that's a lot of money\"",means:"The value isn't clear yet — or he's comparing the price to his bank account instead of to the cost of staying stuck.",diag:"\"Compared to what?\"",wrongs:["\"But you told me you're a 9 out of 10 on fixing this.\"","\"Let's go back to what those lost jobs cost you last month.\""],resp:"\"You told me staying stuck is costing you [their stated cost]. Put the two numbers next to each other — which one is bigger over the next six months?\"",bridge:"\"If the value made sense, is there anything else that would keep you from starting?\""},
 {o:"\"I can't afford it right now\"",means:"Either the cash genuinely isn't there, or the timing of the payment is the problem. Different conversations.",diag:"\"Is this a timing thing or a math thing — the money exists but it's tied up, or it genuinely isn't there right now?\"",wrongs:["\"Everyone says that at first — let me show you the payment calculator.\"","\"Remember what you said staying stuck costs you every month?\""],resp:"If paying would strain payroll or essentials: \"Then we pause — this has to be funded without putting the business at risk.\" If it's timing, look at the verified payment options or set a date after their cash event.",bridge:"\"Want to look at the actual monthly math together, or book a time right after that cash event?\""},
 {o:"\"I need to talk to my spouse / partner\"",means:"A genuinely shared decision (respect it) — or his own hesitation wearing a partner's name.",diag:"\"What do you think they'll ask you — and what do you think your answer will be?\"",wrongs:["\"Most spouses come around once they see results — let's start and show her.\"","\"You scored yourself an 8 — doesn't that mean you're already decided?\""],resp:"\"That makes sense — it's a real decision. Let's answer their likely questions right now, while you have me, so you're not relaying half the information later.\"",bridge:"Book the short three-way call before you hang up: \"Mornings or afternoons — what works better for the two of you?\""},
 {o:"\"I need to think about it\"",means:"One specific question is still unanswered — about fit, risk, or cost. \"Thinking\" is the holding pattern, not the obstacle.",diag:"\"Before you go — what specifically would you need to get clear on for this to be a yes?\"",wrongs:["\"Take your time — I'll check back in a couple of weeks.\"","\"What changed in the last ten minutes?\""],resp:"\"Fair. In my experience there's usually one thing still open. Let's name it and deal with that one thing directly.\" Then deal only with what he names.",bridge:"\"Let's book 48 hours out to land on a yes or a no — either answer is fine. I'd rather have clarity than a maybe.\""},
 {o:"\"Bad timing / not right now\"",means:"The comfort of the current situation is beating the discomfort he described — or there's a real external constraint he hasn't named.",diag:"\"What would need to be different for the timing to be right?\"",wrongs:["\"There's never a perfect time — that's exactly the problem.\"","\"You said this already cost you two years — how many more?\""],resp:"\"The constraint you described doesn't get cheaper with time — it compounds. If we meet again in six months, will the problem be the same one?\" If the constraint is real, respect it and work around it honestly.",bridge:"\"If not now, let's lock a date tied to that event so this doesn't just drift.\""},
 {o:"\"I got burned before — how is this different?\"",means:"He bought information before and got no result. He's protecting himself, not attacking you.",diag:"\"What did you invest in, and what specifically didn't happen that was supposed to?\"",wrongs:["\"We're nothing like those programs — let me walk you through everything that's included.\"","\"That was them. This is us. Trust the process.\""],resp:"\"What you're describing is the difference between a course and implementation. We don't hand you information and leave — we work the one constraint with you until the fix is running in the business.\"",bridge:"\"What would you need to see in the first 30 days to know this is different? Name it, and I'll tell you honestly whether we can deliver it.\""},
 {o:"\"Just send me the information\"",means:"He wants to end the call without saying no — or he's a genuine reader who decides on paper.",diag:"\"What would you be looking for in it that we haven't covered?\"",wrongs:["\"Sure — I'll email the full deck over today.\"","\"Information won't fix this, and you know it.\""],resp:"\"I'll send a short recap built around [their constraint], with the scope and the total price — not a generic deck. The one thing paper can't do is match the plan to what you told me today.\"",bridge:"Send the recap AND book it: \"Let's put 15 minutes on the calendar to go through it together.\""},
 {o:"\"I'll figure it out myself / DIY\"",means:"He believes effort is the missing ingredient. He hasn't connected the problem to structure or accountability yet.",diag:"\"What's been the main thing stopping you from solving it on your own so far?\"",wrongs:["\"If you could have fixed it alone, you would have by now.\"","\"But you booked this call — that says you know you need help.\""],resp:"\"That's not a knock on your effort — the missing piece usually isn't more trying. It's a different angle, from someone who can see what you can't see from inside it, plus someone holding the line while you run the business.\"",bridge:"\"If you run your plan and you're in the same place in six months, can we book a check-in for then?\""},
 {o:"\"My credit isn't great — I probably won't qualify\"",means:"Real financial anxiety, often with shame attached. Zero pressure here — pushing costs the relationship permanently.",diag:"\"Are you worried about the approval itself, the credit check, or taking on the payments?\"",wrongs:["\"Don't worry — almost everybody gets approved.\"","\"Let's just run it and see what happens.\""],resp:"\"The provider decides approval — I won't guess at it. Before anything, we'll confirm exactly how their check works and what it does to your score, and you'd review the rate, the fees, and the total you'd repay before you accept anything.\"",bridge:"\"Want the verified details first, and then we look at them together?\" If he declines, respect it immediately."},
 {o:"\"I'm not ready / my business is too small\"",means:"He doesn't believe someone at his stage belongs — or size is a shield for a risk concern he hasn't said out loud.",diag:"\"What does 'ready' look like — what would need to be true about the business?\"",wrongs:["\"Small is exactly who this is for — size doesn't matter at all.\"","\"Waiting to feel ready is exactly why you're stuck.\""],resp:"\"Size alone doesn't decide fit. The problem and your capacity to act on it do. The owners who get the most from this are close but stuck — not already figured out.\"",bridge:"\"Give me the milestone — a number or a month — and let's book the revisit for when you hit it.\""}
],
es:[
 {o:"«Es mucho dinero / está muy caro»",means:"Todavía no ve claro el valor, o está comparando el precio con su cuenta de banco y no con lo que le cuesta seguir trabado.",diag:"«¿Caro comparado con qué?»",wrongs:["«Pero me dijiste que estás en un 9 para arreglar esto.»","«Volvamos a lo que te cuesta cada mes seguir así.»"],resp:"«Me dijiste que seguir así te está costando [su costo]. Pon los dos números lado a lado — ¿cuál es más grande en los próximos seis meses?»",bridge:"«Si el valor tuviera sentido, ¿habría algo más que te impidiera empezar?»"},
 {o:"«No me alcanza / no tengo el flujo ahorita»",means:"O el dinero de verdad no está, o el problema es el momento del pago. Son dos conversaciones distintas.",diag:"«¿Es un tema de tiempo o de matemáticas? ¿El dinero existe pero está comprometido, o de plano no está?»",wrongs:["«Todos dicen eso al principio — déjame mostrarte la calculadora de pagos.»","«¿Te acuerdas cuánto pierdes cada mes por seguir así?»"],resp:"Si pagar afectaría la nómina o lo esencial: «Entonces pausamos — esto se paga sin poner el negocio en riesgo.» Si es tiempo, se revisan las opciones de pago verificadas o se agenda después de su evento de ingreso.",bridge:"«¿Revisamos juntos cuánto sería al mes, o agendamos para después de ese ingreso?»"},
 {o:"«Necesito hablarlo con mi pareja / socio»",means:"Una decisión genuinamente compartida (respétalo), o su propia duda con el nombre de otra persona.",diag:"«¿Qué crees que te van a preguntar — y qué crees que les vas a responder?»",wrongs:["«Las parejas casi siempre apoyan cuando ven resultados — empecemos y le muestras.»","«Me diste un 8 — eso ya es una decisión, ¿no?»"],resp:"«Tiene todo el sentido — es una decisión real. Respondamos ahorita las preguntas que te van a hacer, mientras me tienes en la línea, para que no llegues con la información a medias.»",bridge:"Agenda la llamada entre los tres antes de colgar: «¿Qué les queda mejor, en la mañana o en la tarde?»"},
 {o:"«Necesito pensarlo»",means:"Hay una pregunta concreta sin respuesta: sobre si encaja, el riesgo o el costo. «Pensarlo» es la sala de espera, no el obstáculo.",diag:"«Antes de que te vayas — ¿qué necesitarías tener claro para que esto sea un sí?»",wrongs:["«Tómate tu tiempo — te busco en dos semanas.»","«¿Qué cambió en los últimos diez minutos?»"],resp:"«Claro, lo entiendo. Casi siempre hay una sola cosa que sigue abierta. Nombrémosla y la resolvemos directo.» Y trabaja solo lo que nombre.",bridge:"«Agendemos para 48 horas y ahí aterrizamos en un sí o un no — las dos respuestas están bien.»"},
 {o:"«No es buen momento / ahorita no»",means:"La comodidad de cómo están las cosas le está ganando al malestar que describió — o hay una limitación real que no ha nombrado.",diag:"«¿Qué tendría que ser diferente para que el momento sí fuera el indicado?»",wrongs:["«Nunca hay un momento perfecto — ese es justo el problema.»","«Ya llevas dos años con esto — ¿cuántos más?»"],resp:"«Lo que me describiste no sale más barato con el tiempo — se acumula. Si hablamos en seis meses, ¿el problema va a ser el mismo?» Si la limitación es real, respétala y trabaja alrededor con honestidad.",bridge:"«Si ahorita no, dejemos una fecha amarrada a ese evento para que esto no se pierda en el aire.»"},
 {o:"«Ya me quemé antes / ¿en qué es diferente esto?»",means:"Ya pagó por información antes y no vio resultados. Se está protegiendo, no te está atacando.",diag:"«¿En qué invertiste, y qué fue exactamente lo que no pasó y se suponía que iba a pasar?»",wrongs:["«Nosotros no somos como esos programas — déjame contarte todo lo que incluye.»","«Eso fue otro. Confía en el proceso.»"],resp:"«Lo que describes es la diferencia entre un curso y la implementación. Nosotros no te entregamos información y te soltamos — trabajamos contigo la única restricción que te está trabando hasta que la solución está corriendo en tu negocio.»",bridge:"«¿Qué necesitarías ver en los primeros 30 días para saber que esto sí es diferente? Nómbralo y te digo con honestidad si lo podemos cumplir.»"},
 {o:"«Mándame la información»",means:"Quiere salir de la llamada sin decir que no — o de verdad decide mejor leyendo con calma.",diag:"«¿Qué estarías buscando en esa información que no hayamos cubierto ya?»",wrongs:["«Claro — te mando hoy mismo la presentación completa.»","«La información no arregla esto, y lo sabes.»"],resp:"«Te mando un resumen corto armado alrededor de [su restricción], con el alcance y el precio total — no un material genérico. Lo único que el papel no puede hacer es ajustar el plan a lo que me contaste hoy.»",bridge:"Manda el resumen Y agenda: «Dejemos 15 minutos el [día] para revisarlo juntos.»"},
 {o:"«Yo lo resuelvo solo / lo hago por mi cuenta»",means:"Cree que lo que falta es esfuerzo. Todavía no conecta el problema con estructura ni con rendición de cuentas.",diag:"«Llevas [su tiempo] lidiando con [su restricción]. ¿Qué ha sido lo que más te ha frenado para resolverlo por tu cuenta hasta ahorita?»",wrongs:["«Si pudieras solo, ya lo habrías resuelto.»","«Pero reservaste esta llamada — eso dice que necesitas ayuda.»"],resp:"«Y no es un golpe a tu esfuerzo — normalmente lo que falta no es intentarlo más fuerte. Es otro ángulo, de alguien que ve lo que no se ve desde adentro, y alguien que sostiene el plan mientras tú operas el negocio.»",bridge:"«Si corres tu plan y en seis meses sigues en el mismo lugar, ¿agendamos de una vez un punto de contacto para entonces?»"},
 {o:"«Mi crédito no está bien / no creo que califique»",means:"Ansiedad financiera real, muchas veces con pena. Aquí, cero presión: empujar te cuesta la relación para siempre.",diag:"«¿Te preocupa la aprobación en sí, la revisión de crédito, o cargar con los pagos?»",wrongs:["«No te preocupes — casi todos califican.»","«Lo corremos y vemos qué pasa.»"],resp:"«La aprobación la decide el proveedor — yo no te voy a adivinar eso. Antes de cualquier cosa, confirmamos exactamente cómo funciona su revisión y si afecta tu score. Y revisamos la tasa, los cargos y el total que pagarías antes de que aceptes nada.»",bridge:"«¿Quieres primero los detalles verificados y los revisamos juntos?» Si dice que no, respétalo de inmediato."},
 {o:"«No estoy listo / mi negocio es muy chico»",means:"Todavía no cree que alguien en su etapa pertenece aquí — o el tamaño es un escudo para un riesgo que no ha dicho en voz alta.",diag:"«¿Cómo se ve 'listo' para ti? ¿Qué tendría que ser verdad en tu negocio?»",wrongs:["«Ser chico es justo para quién es esto — el tamaño no importa para nada.»","«Esperar a estar listo es exactamente el problema.»"],resp:"«El tamaño por sí solo no decide si encaja. Lo deciden el problema y tu capacidad de actuar sobre él. Los que más provecho sacan son los que están cerca pero trabados — no los que ya lo tienen todo resuelto.»",bridge:"«Dame la meta — un número o un mes — y decidimos juntos si es un umbral real; agendamos la retomada para cuando lo alcances.»"}
]};
var DRILL={idx:0,order:[],streak:0,best:0,answered:false};
function drillShuffle(){ DRILL.order=[]; for(var i=0;i<DRILLS[LANG].length;i++)DRILL.order.push(i); for(var i=DRILL.order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=DRILL.order[i]; DRILL.order[i]=DRILL.order[j]; DRILL.order[j]=t; } DRILL.idx=0; DRILL.streak=0; DRILL.answered=false; }
function renderM4(V){
  drillShuffle();
  var en=LANG==="en";
  V.innerHTML='<button class="btn ghost" onclick="go(\'home\')">'+T("backHome")+'</button><h1>'+T("m4t")+'</h1>'
   +'<p class="dim small">'+(en?"The prospect says it. Your first move is always the same: diagnose with ONE question. Pick the diagnostic question — the two wrong options are the classic failure modes: rebutting, dragging him back to his pain, or using his commitment number as leverage.":"El prospecto lo dice. Tu primer movimiento es siempre el mismo: diagnosticar con UNA pregunta. Elige la pregunta de diagnóstico — las dos opciones incorrectas son los errores clásicos: rebatir, arrastrarlo de vuelta a su dolor, o usar su número de compromiso como palanca.")+'</p>'
   +'<div class="card flash" id="drillCard"></div><div id="drillOpts"></div><div class="streak" id="drillMeta"></div>';
  drillShow();
}
function drillShow(){
  var d=DRILLS[LANG][DRILL.order[DRILL.idx]]; DRILL.answered=false;
  var opts=[{t:d.diag,ok:true},{t:d.wrongs[0],ok:false},{t:d.wrongs[1],ok:false}];
  for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
  DRILL.opts=opts;
  $("drillCard").innerHTML='<div class="kicker" style="text-align:center">'+(LANG==="es"?"EL PROSPECTO DICE":"THE PROSPECT SAYS")+'</div><div class="obj">'+esc(d.o)+'</div><p class="small dim" style="text-align:center">'+esc(d.means)+'</p>';
  var h='<p class="small"><b>'+(LANG==="es"?"Tu pregunta de diagnóstico:":"Your diagnostic question:")+'</b></p>';
  for(var k=0;k<opts.length;k++) h+='<button class="opt" onclick="drillPick('+k+')">'+esc(opts[k].t)+'</button>';
  $("drillOpts").innerHTML=h;
  $("drillMeta").textContent=(LANG==="es"?"Tarjeta ":"Card ")+(DRILL.idx+1)+"/"+DRILL.order.length+" · "+(LANG==="es"?"Racha: ":"Streak: ")+DRILL.streak+" · "+(LANG==="es"?"Mejor: ":"Best: ")+Math.max(DRILL.best,PROG.drillBest||0);
}
function drillPick(k){
  if(DRILL.answered) return; DRILL.answered=true;
  var d=DRILLS[LANG][DRILL.order[DRILL.idx]], ok=DRILL.opts[k].ok;
  var btns=$("drillOpts").getElementsByClassName("opt");
  for(var b=0;b<btns.length;b++){ btns[b].disabled=true; if(DRILL.opts[b].ok) btns[b].className="opt right"; else if(b===k) btns[b].className="opt wrong"; }
  if(ok){ DRILL.streak++; if(DRILL.streak>DRILL.best)DRILL.best=DRILL.streak; if(DRILL.best>(PROG.drillBest||0)){PROG.drillBest=DRILL.best; saveProg();} }
  else DRILL.streak=0;
  var h='<div class="fb '+(ok?"ok":"no")+'">'+(ok?(LANG==="es"?"✓ Esa es. Diagnosticaste antes de responder.":"✓ That's the one. You diagnosed before responding."):(LANG==="es"?"✗ Eso es rebatir, presionar o palanca — nunca diagnostica. La pregunta correcta está marcada.":"✗ That's rebutting, pressuring, or leverage — it never diagnoses. The right question is marked."))+'</div>';
  h+='<div class="card"><p class="small"><b>'+(LANG==="es"?"Responde (con sus palabras):":"Respond (in his words):")+'</b><br>'+esc(d.resp)+'</p><p class="small"><b>'+(LANG==="es"?"Puente:":"Bridge:")+'</b><br>'+esc(d.bridge)+'</p></div>';
  h+= DRILL.idx<DRILL.order.length-1 ? '<button class="btn block" onclick="DRILL.idx++;drillShow()">'+(LANG==="es"?"Siguiente objeción →":"Next objection →")+'</button>'
    : '<button class="btn block" onclick="markDone(\'m4\');go(\'home\')">'+(LANG==="es"?"Terminar la práctica ✓":"Finish the deck ✓")+'</button>';
  $("drillOpts").innerHTML+=h;
  $("drillMeta").textContent=(LANG==="es"?"Tarjeta ":"Card ")+(DRILL.idx+1)+"/"+DRILL.order.length+" · "+(LANG==="es"?"Racha: ":"Streak: ")+DRILL.streak+" · "+(LANG==="es"?"Mejor: ":"Best: ")+Math.max(DRILL.best,PROG.drillBest||0);
}
</script>
<script>
/* ============ MODULE 5 — GUIDED WALK-THROUGH + AUDIO ============ */
var WALK={
en:{persona:"Tyler Brennan — roofing, 11 employees, revenue flat at ~$900K for two years, stuck on getting leads. His wife runs the books and co-decides.",
nodes:[
 {pro:"\"Yeah, getting leads is still the main thing. And my wife runs the books — she's part of any big decision. I gotta be straight with you though: last year we paid a marketing agency $7,500 and got almost nothing out of it. How is this different from that?\"",opts:["Defend it now: \"We're not an agency — we're completely different, we do implementation, accountability, weekly calls…\"","\"That's fair — and I'm glad you said it now instead of at the end. Let me park that: before I show you anything or talk about any price, we'll come back to exactly that. Hold me to it. Now — what are you struggling with on the lead side specifically?\"","Let it pass and ask: \"How long has it been like this?\""],ans:1,why:"Park-and-return. You acknowledge it, name the moment you'll answer it (Step 5, before any price), and keep discovering. Defending now starts a debate; ignoring it leaves it open — and an unreturned park caps his trust for the whole call. The co-decider is also already on your sheet — noted at minute 2, not discovered at the close."},
 {pro:"\"It's both, honestly. Some months the phone doesn't ring. And even when leads come in they slip through — last month we lost two jobs, $25–30K, because nobody followed up.\"",opts:["Mirror the whole answer back, then ask how it's landing at home.","\"What have you already tried to fix this, outside of the agency?\" — then what he got from it, and why it didn't stick.","Move to the goal: \"What would it feel like to have this completely solved?\""],ans:1,why:"Run the prior-failure branch while the pain is fresh. What he bought, expected, did, and why it failed is the raw material your Step 5 return is built from. Skipping it leaves the return generic — and generic returns don't land."},
 {pro:"He's given you the pain (lost jobs, flat revenue, 55+ hour weeks) and the goal (phone rings on its own, every lead worked same day, home by 6). Time for the gap.",opts:["\"So let me make sure I've got this. Today it's not enough leads coming in, and the ones that do aren't getting followed up — two lost jobs last month, $25–30K gone, revenue stuck at $900K for two years while you work 55-plus hours to hold it together. And where you want to be is the phone rings on its own, every lead worked same day, crew busy without you scrambling, home by 6 on a Tuesday. Did I get that right?\"","\"So basically your whole business is falling apart and it's bleeding into every part of your life — you must be exhausted and desperate to fix this.\"","Skip the summary and ask what happens if nothing changes."],ans:0,why:"The ONE mirror: his words, his numbers, no added drama, no bigger emotion than he used. Option 2 amplifies beyond what he said — analytical owners dock trust for exactly that. He confirmed this mirror clean in the real call, and both pictures locked in."},
 {pro:"\"If nothing changes, I'm still right here in six months. Same $900K, still losing jobs we never hear about.\"",opts:["\"Why is this urgent for you? And honestly, why not just wait until next year? And what happens if you keep waiting?\"","\"What made you book this call now?\"","\"Why haven't you fixed this already if it matters this much?\""],ans:1,why:"Urgency is ONE question — the strongest one. Stacking three versions reads as pressure. Shaming him for not fixing it is leverage, not discovery."},
 {pro:"Discovery is done. The parked agency objection is still open. Commitment is next.",opts:["Ask: \"On a scale of 1 to 10, how committed are you — and do you trust that outside help fixes this?\"","Pay off the park first — \"I promised we'd come back to the agency. Here's the honest answer…\" — confirm it's answered, THEN ask readiness and trust as two separate beats.","Go straight to the pitch while the gap is hot."],ans:1,why:"Order is everything: return → readiness → trust → transition → pitch. He answered readiness 7 and explained both gaps (the agency scar, his wife) only because the return came first. Merge the two commitment questions and both answers blur."},
 {pro:"He's at a 7, trust is real but not complete. Time to pitch and price.",opts:["Walk him through all three tiers so he can pick.","Name the specific first intervention (build the follow-up process his team owns, in the first 4–6 weeks), explain why the Accelerator fits HIS situation, then: \"For you, it's the Accelerator — $5,499 in total, for six months of implementation with us.\" Then stop talking.","Lead with: \"It works out to only about $30 a day.\""],ans:1,why:"One recommendation routed by support need. Fit before price. Total first — then silence. The $30-a-day line before his reaction is leading with the discount frame; it belongs after his first reaction, if at all."},
 {pro:"\"$5,499. That's a lot — and my wife's going to look at that number and ask exactly what we're getting. I need to talk to my wife. And let me think about it a day or two.\"",opts:["\"You scored yourself a 7 — with that readiness, why not just start and bring her in as we go?\"","\"Go home, talk it over, and I'll email you the details.\"","\"That makes sense — she runs the books. What do you think she'll ask you? … Let's get her on a short call with us, the three of us, so she hears it directly. Thursday morning, I'll send a one-page summary tonight so you can look at it together first.\""],ans:2,why:"Diagnose the spouse objection, then book the three-way on this call with a shareable summary — never send him home to sell it secondhand, and never end on \"I'll email you.\" Using his 7 as leverage is the one move that would have burned the trust the whole call built."}
],
end:"<b>What actually happened:</b> his readiness rose 7 → 8 and trust to 7.5. He named the park-and-return as the moment trust rose most. The price caused a brief dip that recovered the moment the rep locked a specific three-way call (Thursday morning) instead of leaving it as \"talk it over.\" He didn't enroll on the spot — by design — and he showed up to the next step."},
es:{persona:"Roberto Salas — pintura y remodelación, 7 empleados, ~$550K al año, trabado en flujo de caja. Su esposa Patricia lleva la oficina y co-decide.",
nodes:[
 {pro:"«Sí, el flujo de caja es lo que me tiene más fregado. Un cliente me debe desde hace casi mes y medio y el mes pasado saqué seis mil dólares de mis ahorros para cubrir nómina. Y antes de seguir, te pregunto directo: ¿en qué se diferencia esto de un curso? Mi primo pagó como cuatro mil por uno y no sacó nada.»",opts:["Explicarlo completo ahora: «Esto no es un curso, es implementación con acompañamiento semanal…»","«Es justo — y qué bueno que lo dices ahora y no al final. Lo anoto: antes de mostrarte cualquier cosa o hablar de precios, volvemos a ese punto. Te lo cumplo — si no te lo respondo, me lo reclamas. ¿Trato hecho?» Y sigues con el descubrimiento.","Pasarlo por alto y preguntar desde cuándo está así."],ans:1,why:"Anotar y regresar. Reconoces la objeción, nombras el momento en que la vas a responder (Paso 5, antes del precio) y sigues descubriendo. Defenderte ahora abre un debate; ignorarla la deja abierta y limita la confianza toda la llamada. Patricia ya quedó en la ficha: co-decide, preguntado al minuto 2."},
 {pro:"«Este año ya saqué unos 22 mil de mi bolsillo o dejé de invertir. Tengo entre 60 y 80 mil en cuentas por cobrar atrasadas. Intenté anticipos del 50%, recordatorios por correo, hasta contraté a alguien part-time y el flujo no aguantó pagarle.»",opts:["Preguntar una quinta y sexta cosa sobre el dolor para tenerlo todo.","«¿Y si esto estuviera resuelto de verdad, qué se sentiría diferente para ti y para Patricia? De aquí a seis meses, ¿cómo se vería un martes normal?»","Devolverle todo su resumen en espejo y luego preguntar por el impacto en casa, aunque ya lo mencionó."],ans:1,why:"El dolor ya tiene ejemplo, costo e intentos anteriores: el presupuesto se cumplió. Ahora va la meta. Y el impacto personal ya lo dio él solo — volver a preguntarlo delata la técnica."},
 {pro:"Ya tienes el dolor y la meta. Es momento del espejo y la brecha.",opts:["«Déjame ver si lo tengo claro. Hoy facturas cerca de 550 mil pero tienes entre 60 y 80 mil atrasados, este año sacaste unos 22 mil de tu bolsillo, y la cobranza se hace solo cuando hay tiempo. Quieres llegar al viernes de nómina sin ese nudo en el estómago, que Patricia no revise el saldo tres veces al día, y crecer hacia el millón sin más estrés. ¿Lo dije bien?»","«O sea que tu negocio está ahogando a tu familia y estás desesperado por salir de esto.»","Saltar el resumen y preguntar directamente qué pasa si no cambia nada."],ans:0,why:"El ÚNICO espejo: sus palabras, sus números, sin drama agregado. La opción 2 le pone más emoción de la que él usó — eso cuesta confianza. En la llamada real confirmó el espejo limpio."},
 {pro:"Discovery completo. La objeción del curso de su primo sigue abierta. Sigue el compromiso.",opts:["«Del 1 al 10, ¿qué tan comprometido estás y qué tanta confianza nos tienes?» — todo en una pregunta.","Cumplir lo anotado primero: «Te prometí que volvíamos a lo del curso…» — responder con el mecanismo (sistema de cobranza construido con él, seguimiento semanal), confirmar que quedó respondido, y DESPUÉS disposición y confianza como dos momentos separados.","Ir directo a la propuesta mientras la brecha está fresca."],ans:1,why:"El orden lo es todo: regreso → disposición → confianza → transición → propuesta. Dio disposición 7 y confianza 8 solo porque el regreso vino primero. Juntar las dos preguntas borra las dos respuestas."},
 {pro:"Disposición 7, confianza 8. Llega el momento del precio.",opts:["Explicar primero el encaje («la razón por la que te pongo frente al Accelerator es tu situación…»), la primera intervención concreta (el sistema de cobranza en las primeras 4 a 6 semanas), y decir: «Para ti, es el Accelerator — 5,499 dólares en total, por seis meses de implementación con nosotros.» Y callar.","Abrir con: «Sale a unos 30 dólares al día, ni se siente.»","Darle los tres niveles completos para que él elija."],ans:0,why:"Encaje antes que precio, una sola recomendación según la necesidad de apoyo, total primero y silencio. En la práctica real, el precio llegó «un poco seco» por falta de contexto previo — el encaje es lo que lo suaviza. La línea diaria va solo después de su primera reacción."},
 {pro:"«Te voy a ser directo: el crédito no está en su mejor momento. Tuvimos atrasos en la pandemia. No sé si calificaría para un financiamiento.»",opts:["«No te preocupes, casi todos califican — lo corremos y vas a ver que sales aprobado.»","«Te agradezco que me lo digas directo. Esto sí te lo prometo: nadie aquí te dice que estás aprobado antes de que el socio lo revise de verdad — y esa revisión es una consulta suave, preguntar no afecta tu crédito. Sea cual sea la respuesta, la manejamos con honestidad desde ahí.»","Cambiar de tema rápido y volver al sistema de cobranza."],ans:1,why:"La frase de dignidad, tal cual: cero promesas, consulta suave explicada, honestidad. En su retroalimentación, Roberto dijo que este fue el momento más importante de toda la llamada — si le hubieran prometido la aprobación, lo pierden ahí mismo."},
 {pro:"«Todo tiene sentido, pero no puedo decidir solo. Patricia tiene que estar en esta conversación.»",opts:["«Platícalo con ella esta noche y me avisas mañana.»","«Entiendo. Agendemos una llamada corta entre los tres — ¿el martes a las 10 les funciona? — para que ella lo escuche directo. Tú me confirmas mañana en la mañana.»","«Me diste un 8 de confianza — ¿no es eso suficiente para firmar hoy?»"],ans:1,why:"Co-decisor = llamada entre tres, con día y hora, agendada en esta llamada — nunca mandarlo a venderlo en casa. Usar su número como palanca rompe exactamente la confianza que el momento de crédito construyó."}
],
end:"<b>Lo que pasó en realidad:</b> su disposición cerró en 7.5 y su confianza en 7. Nombró tres momentos que subieron su confianza: que la objeción del curso se anotó y se cumplió antes del precio, el espejo con sus palabras, y — el más importante — que nadie le prometió la aprobación del financiamiento. Quedó agendada la llamada entre tres con Patricia (martes 10 AM, por confirmar) con intención genuina de avanzar."}};

  h+='<div class="card"><b>'+(en?"Spanish — Roberto (painting & remodeling)":"Español — Roberto (pintura y remodelación)")+'</b><audio controls preload="none" src="roleplay-es-roberto.mp3"></audio><p class="small dim">'+T("listenFor")+' '+(en?"how the parked course objection gets answered before the pitch, the mirror in his own words, the financing answer that promises nothing — and the scripted price, delivered clean.":"cómo la objeción del curso se responde antes de la propuesta, el espejo con sus palabras, la respuesta de financiamiento que no promete nada — y el precio del guion, dicho limpio.")+'</p></div>';

   ["Primera ronda de prácticas: nadie llegó nunca a la propuesta. El descubrimiento sin límite se comió la llamada completa. Arreglo: límites de preguntas por paso y ruta corta.","El escepticismo anotado que nunca se respondió limitó la confianza en todas las llamadas. Arreglo: el regreso del Paso 5 es un paso con nombre, antes de la propuesta.","Hacer espejo de cada respuesta sonaba a técnica. Arreglo: espejo una sola vez, en la brecha, con sus palabras exactas.","El número de compromiso solo medía lo equivocado. Arreglo: disposición (el trabajo) + confianza (la ayuda de fuera), como dos momentos separados.","Con el guion v2, ambas llamadas completaron el arco completo: descubrimiento → regreso → compromiso → propuesta → precio → objeciones → un siguiente paso con fecha. Anotar y regresar fue el mayor constructor de confianza en las dos."];

function walkPick(i){
  var w=WALK[LANG], n=w.nodes[WALKIDX];
  var btns=$("walkOpts").getElementsByClassName("opt");
  for(var b=0;b<btns.length;b++){ btns[b].disabled=true; if(b===n.ans)btns[b].className="opt right"; else if(b===i)btns[b].className="opt wrong"; }
  if(i===n.ans)WALKRIGHT++;
  $("walkFb").innerHTML='<div class="fb '+(i===n.ans?"ok":"no")+'">'+(i===n.ans?"✓ ":"✗ ")+esc(n.why)+'</div><button class="btn block" onclick="WALKIDX++;walkShow()">'+(LANG==="es"?"Siguiente momento →":"Next beat →")+'</button>';
}

/* ============ MODULE 6 ============ */
function renderM6(V){
  var en=LANG==="en";
  var md=mdText(en?"md-script-en":"md-script-es");
  var idx=md.indexOf(en?"### One-screen cheat sheet":"### Hoja resumen");
  var cheat = idx>=0 ? md.substring(idx) : "";
  window._cheatText = (en?"md-script-en":"md-script-es")=== "md-script-en" ? cheat : cheat;
  var h='<button class="btn ghost" onclick="go(\'home\')">'+T("backHome")+'</button><h1>'+T("m6t")+'</h1>';
  h+='<div class="card"><h3 style="margin-top:0">'+(en?"1 · The mirror recap — same day":"1 · El resumen espejo — el mismo día")+'</h3><p class="small">'+(en?"Same day, by email or text. Their words back to them, no pitch:":"El mismo día, por correo o mensaje. Sus palabras de vuelta, sin vender nada:")+'</p><blockquote style="margin:8px 0;padding:10px 12px;background:#101010;border-left:3px solid var(--gold)"><p class="small">'+(en?"\"You said today it's [pain], and the goal is [goal]. [The first intervention] is where we'd start. Next step: [booked date/time].\"":"«Dijiste que hoy [dolor], y que la meta es [meta]. [La primera intervención] es por donde empezaríamos. Siguiente paso: [fecha/hora reservada].»")+'</p></blockquote><p class="small dim">'+(en?"Fast and short beats long and polished. It also restarts the conversation in his words, not yours.":"Rápido y corto le gana a largo y pulido. Y reinicia la conversación con sus palabras, no las tuyas.")+'</p></div>';
  h+='<div class="card"><h3 style="margin-top:0">'+(en?"2 · A dated next step — always":"2 · Un siguiente paso con fecha — siempre")+'</h3><p class="small">'+(en?"Every call ends with a decision or a booked step: enrollment, a three-way call with the co-decider, or a follow-up booked on Calendly before you hang up. Never end on \"I'll email you.\" A call that ends in the air restarts at zero.":"Cada llamada termina con una decisión o un paso agendado: la inscripción, una llamada entre tres con el co-decisor, o un seguimiento agendado en Calendly antes de colgar. Nunca termines con «te mando un correo». Una llamada que termina en el aire reinicia desde cero.")+'</p></div>';
  h+='<div class="card"><h3 style="margin-top:0">'+(en?"3 · Log it — the tracker stages":"3 · Regístralo — las etapas del registro")+'</h3><p style="text-align:center"><b>'+(en?"Captured → Contacted → Engaged → Scheduled → Closed":"Captado → Contactado → Interesado → Agendado → Cerrado")+'</b></p><p class="small">'+(en?"Log every call the same day: outcome/stage, the readiness number, the trust answer, their exact pain and goal words, any parked objection and how it was answered, and the booked next step. The next rep who touches this lead needs all of it — an unlogged call is a call the team has to redo.":"Registra cada llamada el mismo día: resultado/etapa, el número de disposición, la respuesta de confianza, sus palabras exactas de dolor y meta, cualquier objeción anotada y cómo se respondió, y el siguiente paso agendado. El próximo que toque a este prospecto necesita todo eso: una llamada sin registro es una llamada que el equipo tiene que repetir.")+'</p></div>';
  h+='<div class="card"><h3 style="margin-top:0">'+(en?"4 · The follow-up standard":"4 · El estándar de seguimiento")+'</h3><ul class="small"><li>'+(en?"First touch fast — speed is the message.":"Primer contacto rápido: la velocidad es el mensaje.")+'</li><li>'+(en?"For leads who don't book: five touches in seven days, across at least two channels.":"Para quien no agenda: cinco contactos en siete días, en al menos dos canales.")+'</li><li>'+(en?"Every follow-up is written in their words and tied to their constraint — never a generic \"just checking in.\"":"Cada seguimiento se escribe con sus palabras y atado a su restricción — nunca un genérico «solo pasaba a saludar».")+'</li><li>'+(en?"Pre-call: anyone who books gets the prep video before the call, so the call starts at their constraint, not at zero.":"Antes de la llamada: quien agenda recibe el video de preparación, para que la llamada arranque en su restricción, no en cero.")+'</li></ul></div>';
  h+='<h2>'+(en?"Live-call cheat sheet — copy it":"Hoja resumen para la llamada — cópiala")+'</h2><div class="card md" id="cheatBox">'+mdToHtml(cheat)+'</div>';
  h+='<button class="btn block" onclick="copyCheat()">'+(en?"Copy the cheat sheet":"Copiar la hoja resumen")+'</button><div id="copyMsg"></div>';
  h+='<div style="height:8px"></div>'+doneBtn("m6");
  V.innerHTML=h; window._cheatPlain=cheat;
}
function copyCheat(){
  var txt=window._cheatPlain||"";
  function done(){ $("copyMsg").innerHTML='<div class="fb ok">✓ '+(LANG==="es"?"Copiado. Pégalo donde tomes tus notas de llamada.":"Copied. Paste it wherever you keep your call notes.")+'</div>'; markDone("m6"); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ fallbackCopy(txt); done(); }); }
  else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){
  var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta);
}

en:[
 {q:"Minute 4: \"Honestly, I got burned by a program last year.\" Your move?",opts:["Answer the difference fully, right now.","Park it: acknowledge, promise to answer it before any price, keep discovering.","Change the subject back to his pain numbers."],ans:1,why:"Park-and-return. Answering early starts a debate; the named Step 5 return makes the answer land — and skipping the return entirely is the failure that capped trust in testing.",mod:"m1"},
 {q:"The co-decider question (\"who else is part of a decision like this?\") belongs…",opts:["At the close, if a spouse objection appears.","In Step 0, around minute 2.","Only on calls over a certain price."],ans:1,why:"Asked early, it decides how you close and never ambushes you at minute 28.",mod:"m2"},
 {q:"Step 1 pain has a hard question budget of…",opts:["As many as it takes.","Four questions.","Two questions."],ans:1,why:"Four: struggling with what, how long, recent example, what it cost — plus the prior-failure branch. Budgets are what got v2 calls to a pitch.",mod:"m2"},
 {q:"The full mirror of his words happens…",opts:["After every step.","Once, at the Step 3 summary.","Only if he asks whether you understand."],ans:1,why:"Once. Their exact words, no added emotion. Repeated mirroring reads as technique.",mod:"m2"},
 {q:"Urgency is…",opts:["Three angles on why now.","One question — \"What made you book this call now?\" — with at most one follow-up.","Skipped when the gap was strong."],ans:1,why:"One question, one follow-up. Repetition reads as pressure.",mod:"m2"},
 {q:"In the commitment step, the 1–10 number measures… and the second question measures…",opts:["Budget / timeline.","Readiness to do the work / trust that outside help gets them there.","Pain / income."],ans:1,why:"Readiness and trust, asked as two separate beats. The trust gap is what your pitch must answer.",mod:"m1"},
 {q:"Price delivery, exactly:",opts:["Monthly first, so it feels smaller.","\"About $30 a day\" to soften it.","Total first — \"$5,499 in total\" — then stop talking."],ans:2,why:"Total first, then silence. The next voice on the call is his.",mod:"m3"},
 {q:"The ~$30-a-day reframe may be used…",opts:["As the opener of the pitch.","Only after his first price reaction, next to the cost of staying stuck HE stated.","Whenever price comes up."],ans:1,why:"Backup only. And if the cash problem is genuinely real, skip it entirely and go to financing.",mod:"m3"},
 {q:"Financing, when it comes up, is presented as…",opts:["\"You'll almost certainly be approved — it's a soft check.\"","Monthly + total + rate together, soft-pull pre-qualification explained, approval never promised.","A monthly figure only, details later."],ans:1,why:"All three numbers together, the soft pull explained, and no promised approval — the provider decides.",mod:"m3"},
 {q:"He raises his own credit, quietly and embarrassed. You…",opts:["Reassure him: \"Don't worry, they approve almost everyone.\"","Use the dignity line: nobody tells him he's approved before the partner runs it, the check is a soft pull that doesn't hurt his credit, and whatever comes back gets handled honestly.","Move on quickly so he isn't uncomfortable."],ans:1,why:"In the practice call, that exact honest answer was the single most important trust moment of the entire conversation.",mod:"m3"},
 {q:"\"I need to talk to my wife.\" Diagnose with…",opts:["\"What would she need to hear to be comfortable?\"","\"What do you think she'll ask you — and what do you think your answer will be?\"","\"Is she usually supportive of investments like this?\""],ans:1,why:"His answer tells you whether it's a shared decision or his own hesitation — and prepares him to answer her real questions.",mod:"m4"},
 {q:"\"Just send me the information.\" You…",opts:["Send the full deck and follow up next week.","Diagnose — \"What would you be looking for in it that we haven't covered?\" — then send a tailored recap AND book 15 minutes to review it together.","Refuse: \"Paper never closed anyone.\""],ans:1,why:"Diagnose first. The recap is built around his constraint with the total price — and it's paired with a booked review, never sent into the void.",mod:"m4"},
 {q:"\"I'll figure it out myself.\" Diagnose with…",opts:["\"What's been the main thing stopping you from solving it on your own so far?\"","\"If you could, wouldn't you have by now?\"","\"What tools would you use?\""],ans:0,why:"Let him diagnose his own gap. Rebutting it (\"you would have by now\") is an argument, not a question.",mod:"m4"},
 {q:"Tiers are routed by…",opts:["The commitment number — 8s and up get Elite.","Support need: the constraint, the support he says he needs, his timeline.","Whichever tier he asks about first."],ans:1,why:"Never by the score. The Accelerator is the default for a qualified owner; Elite only when the support need is genuinely there.",mod:"m3"},
 {q:"His readiness comes back a 4. You…",opts:["Pitch anyway — the pitch might raise it.","Ask what would raise it; if it's genuinely \"not now,\" don't drop a price — offer the community and book a follow-up.","End the call on the spot."],ans:1,why:"Under 5, paid programs aren't the fit yet. Disqualify kindly, keep him close through the guide and community.",mod:"m2"},
 {q:"SCENARIO — Minute 15, you're not past Step 3 and he's watching the clock. You…",opts:["Rush through every remaining step at double speed.","Switch to the compression path and protect the pitch and the dated close.","Skip commitment and price; book a second call for the pitch."],ans:1,why:"Compression path: example + cost → nothing changes → why not alone → why now → readiness/trust → pitch → dated step.",mod:"m2"},
 {q:"SCENARIO — Price is out. He says: \"I need to talk to my wife and think about it.\" You…",opts:["\"Take the weekend — I'll call you Monday.\"","Diagnose both, then book the three-way call with his wife before hanging up and send the one-page summary tonight.","Remind him he scored himself ready and ask what changed."],ans:1,why:"Book the three-way on this call. Never send him home to sell it secondhand, never use his number as leverage, never end in the air.",mod:"m5"},
 {q:"SCENARIO — A teammate suggests opening your next call's close with: \"You told me you're a 9, so let's get you started.\" You…",opts:["Use it — he said it, after all.","Never. The commitment number is never used as leverage, in any form.","Use it only if he's above an 8."],ans:1,why:"The number measures his readiness for your understanding — the moment it becomes a weapon, every future answer on every call gets guarded.",mod:"m1"}
],

 {q:"La urgencia es…",opts:["Tres ángulos del por qué ahora.","Una pregunta — «¿Qué te hizo reservar esta llamada justo ahora?» — con un solo seguimiento máximo.","Se salta cuando la brecha fue fuerte."],ans:1,why:"Una pregunta, un seguimiento. Repetirla se siente como presión.",mod:"m2"},

function renderGate(V){
  var en=LANG==="en";

   +'<p class="dim small">'+(en?"18 questions across every module, including three live-call decisions. 80% (15 of 18) clears you for live calls. Miss — and the result names exactly which modules to redo. No partial credit for \"close.\"":"18 preguntas de todos los módulos, incluyendo tres decisiones de llamada real. Con 80% (15 de 18) quedas listo para llamadas reales. Si no apruebas, el resultado te dice exactamente qué módulos repetir. Sin crédito parcial por «casi».")+'</p>'
   + quizHtml(GATEQ[LANG],"gate");
  quizInit("gate",GATEQ[LANG]);
  QUIZSTATE["gate"].onDone=function(pct){
    PROG.gate=pct; saveProg();
    var sum=$("gate-sum"); var qs=GATEQ[LANG], st=QUIZSTATE["gate"];
    if(pct>=80){
      markDone("gate");
      sum.innerHTML+='<p><b>'+(en?"✓ READY FOR LIVE CALLS":"✓ LISTO PARA LLAMADAS REALES")+'</b></p><p class="small">'+(en?"You cleared the gate. Your first-week standard, on every call:":"Aprobaste el examen. Tu estándar de la primera semana, en cada llamada:")+'</p><ul class="small"><li>'+(en?"Run the prep block before every call — their constraint in their words, written down before you dial.":"Corre el bloque de preparación antes de cada llamada: su restricción con sus palabras, escrita antes de marcar.")+'</li><li>'+(en?"Log every call the same day — stage, readiness, trust, their exact words, the booked next step.":"Registra cada llamada el mismo día: etapa, disposición, confianza, sus palabras exactas, el siguiente paso agendado.")+'</li><li>'+(en?"Send the mirror recap the same day. Every call.":"Manda el resumen espejo el mismo día. En cada llamada.")+'</li><li>'+(en?"One decision or one booked next step, every time.":"Una decisión o un siguiente paso agendado, siempre.")+'</li></ul>';
    } else {
      var mods={};
      for(var i=0;i<qs.length;i++){ if(st.picked[i]!==qs[i].ans){ mods[qs[i].mod]=true; } }
      var names={m1:T("m1t"),m2:T("m2t"),m3:T("m3t"),m4:T("m4t"),m5:T("m5t")};
      var list=""; for(var k in mods){ if(mods.hasOwnProperty(k)) list+='<li>'+names[k]+'</li>'; }
      sum.innerHTML+='<p><b>'+(en?"Not yet — redo these modules, then retake the gate:":"Todavía no — repite estos módulos y vuelve a presentar el examen:")+'</b></p><ul class="small">'+list+'</ul><button class="btn block" onclick="go(\'home\')">'+T("backHome")+'</button>';
    }
  };
}

roberto:{ name:"Roberto Salas", biz:"Pintura y remodelación · 7 empleados · ~$550K/año", prep:"Su formulario dice que está trabado en FLUJO DE CAJA. Su esposa Patricia lleva la oficina y co-decide.", startR:7, startT:5, coDecider:"Patricia", skepticismAt:"pain", concernKeys:["curso","primo","powerpoint","teoría","teoria"],
 L:{ greet:"Hola. Sí, reservé la llamada — cuéntame.",
  qualifyAns:"Sí, el flujo de caja es lo que me tiene más fregado. Tengo un cliente que me debe desde hace casi mes y medio, y el mes pasado tuve que sacar seis mil dólares de mis ahorros personales para cubrir nómina. Mi esposa Patricia lleva la oficina y conoce los números igual que yo — en algo así los dos tenemos que estar de acuerdo.",
  parkAckGood:"Trato. Te lo voy a exigir, ¿eh? Sigue.", parkAckBad:"…Ándale pues.",
  painAns:"Facturamos casi 550 mil el año pasado, pero el dinero no está cuando lo necesito. En cualquier momento tengo entre 60 y 80 mil dólares en cuentas por cobrar atrasadas, y este año ya saqué unos 22 mil de mi bolsillo o dejé de invertir. Y antes de seguir te pregunto directo: ¿en qué se diferencia esto de un curso? Mi primo pagó como cuatro mil dólares por uno de esos programas de mentoría y no sacó nada. Puro PowerPoint y teoría. No quiero perder mi dinero así.",
  triedAns:"Empecé a pedir el 50% de anticipo antes de arrancar — ayudó un poco, pero los comerciales, que son los que más facturan, no siempre aceptan. Mando recordatorios por correo y nadie les hace caso. Intenté contratar a alguien part-time para la cobranza y a los dos meses lo tuve que soltar: el flujo no aguantó pagarle a él también. Un círculo vicioso.",
  goalAns:"Llegar al viernes de nómina sin ese nudo en el estómago. Que Patricia no tenga que revisar el saldo tres veces al día. Saber cuánto entra y cuándo, poder comprar el equipo cuando llega un contrato grande — y crecer hacia el millón sin que eso signifique más estrés.",
  gapAns:"Si esto sigue igual, el año que viene serán 30, 40 mil perdidos o sin invertir. Y ese contrato grande que tengo en puerta: si no puedo comprar el equipo, lo pierdo o lo subcontrato y me como la mitad de la utilidad. Y Patricia y yo llevamos 18 años juntos — no quiero que el negocio nos siga generando esta tensión.",
  urgencyAns:"Patricia me lo dijo la semana pasada y me cayó gordo, pero tenía razón: «Roberto, o buscas ayuda o seguimos igual otros cinco años». Por eso reservé esta llamada justo ahora.",
  returnGood:"Eso sí tiene más sentido. Lo que mató el curso de mi primo fue que salió con un montón de apuntes y cero cambios. Si trabajamos sobre mis números reales, con seguimiento para que se implemente de verdad… eso sí suena diferente. El escepticismo se me va cuando vea resultados, pero la diferencia quedó clara.",
  returnBad:"Sigo sin ver la diferencia con el curso de mi primo, la verdad. Las palabras son fáciles.",
  readinessAns:"Un 7, honestamente. Ya sé que algo tiene que cambiar — lo siento en el estómago cada quincena. Pero no te digo 10: todavía no sé exactamente qué implica en tiempo y en dinero, y Patricia no ha estado en esta conversación.",
  trustAns:"Un 8. Ya lo intentamos solos: anticipos, correos, contratar a alguien. Patricia y yo ponemos el esfuerzo — el problema es que no sabemos lo que no sabemos. El 2 que falta es el curso de mi primo hablando todavía.",
  pitchPrompt:"A ver — muéstrame cómo se vería trabajar juntos.",
  pricePrompt:"¿Y cuánto cuesta?",
  priceReaction:"Cinco mil cuatrocientos noventa y nueve dólares. Es… bastante dinero, Francisco. No te voy a mentir, el número me pegó. Entiendo el problema, lo vivo cada quincena — pero comprometer esa cantidad de un golpe se siente muy distinto a perderla poco a poco. ¿Cómo se paga eso? ¿De un solo golpe o hay alguna forma de estructurarlo?",
  priceReactionBad:"Espérame — ni dejaste que el número cayera. Así se siente que me estás vendiendo, no informando.",
  obj_fin_line:null,
  creditLine:"Y te voy a ser directo, porque tú lo has sido conmigo: el crédito no está en su mejor momento. Hemos tenido algunos atrasos, cosas de la pandemia que todavía nos persiguen. Cuando preguntas cómo se paga, no es curiosidad — es que no sé si calificaría para algo si hay financiamiento de por medio.",
  creditGood:"Aprecio cómo manejaste lo del crédito. No me prometiste nada, no me diste un «sí, claro que calificas» para cerrarme. Eso me da más confianza que si me hubieras dicho que todo iba a estar bien. Vamos bien.",
  creditBad:"Eso de «casi todos califican» es justo lo que me dicen antes de que el papel diga otra cosa. Ahí sí me preocupaste.",
  obj_familia_line:"Y otra cosa, y es la más importante: yo no puedo tomar esta decisión solo. Patricia estuvo conmigo en la pandemia, vivió los atrasos, sabe lo que nos costó. Si llego a la casa y le digo «firmé», aunque yo esté convencido, eso nos genera un problema. Ella tiene que estar en esta conversación.",
  closeGood:"El martes a las 10 me funciona a mí. Te mando mensaje mañana en la mañana para confirmar con Patricia — y si no puede a esa hora, te doy dos opciones que sí le sirvan. Gracias por cómo manejaste todo esto.",
  closeOk:"Ándale — déjalo agendado y me mandas el resumen.",
  closeBad:"Lo platico con Patricia esta noche y te aviso."},
 objs:["obj_fin","credit","obj_familia"], creditAfterFinancing:true},
miguel:{ name:"Miguel Torres", biz:"Jardinería / landscaping · 5 empleados · ~$380K/año", prep:"Su formulario dice que está trabado en CONSEGUIR CLIENTES CONSTANTES — vive de referidos. Es temporada alta: trabaja 60 horas por semana.", startR:6, startT:5, coDecider:"esposa", skepticismAt:null, concernKeys:[],
 L:{ greet:"Qué tal. Tengo media hora entre trabajos — vamos.",
  qualifyAns:"Conseguir clientes constantes, eso es. Vivo de referidos, y cuando bajan los referidos baja todo. Mi esposa no está en el negocio, pero los gastos grandes los revisa conmigo — eso que ni qué.",
  painAns:"Somos cinco empleados, unos 380 mil al año en jardinería y landscaping. Ahorita es temporada alta y estoy trabajando 60 horas a la semana con el equipo. Los clientes llegan por referidos y por temporada — en invierno se seca todo y ando viendo qué hacer.",
  timingLine:"Y mira, te soy honesto: ahorita es temporada alta. No tengo tiempo ni de pensar en programas. Estoy a 60 horas — ¿cuándo haría yo esto?",
  timingGood:"Bueno… eso sí cambia la cosa. Si el sistema se construye en las llamadas y el equipo lo corre, no es otra jornada encima de mí. Sigue.",
  timingBad:"Eso suena a que me estás diciendo que mi tiempo no importa. Sí importa — es lo que no tengo.",
  triedAns:"Hice una página de Facebook y a veces publico fotos de los trabajos. Probé anuncios unos meses — gasté y llegó poco. Todo lo que tengo viene de referidos y de trabajos bien hechos. Nunca armé nada sistemático.",
  goalAns:"Clientes constantes todo el año, no solo en temporada. Aunque sea una lista de espera chica en invierno. Y dejar de trabajar 60 horas para sostener lo mismo.",
  gapAns:"En seis meses llega el invierno otra vez y voy a estar igual: buscando trabajos, bajando precios para llenar la agenda. Cada año es el mismo ciclo y cada año digo que va a ser distinto.",
  urgencyAns:"Este invierno pasado fue el más flojo en años. Juré que no pasaba otro así sin hacer algo diferente. Por eso agendé, aunque sea temporada alta.",
  readinessAns:"Un 6. Quiero el cambio, pero mi duda es real y es el tiempo. Si esto me pide horas que no tengo, se cae — por más bueno que sea.",
  trustAns:"Un 5. No conozco a nadie de mi ramo que haya hecho algo así. No es desconfianza contigo — es que nunca he visto que funcione para un negocio como el mío.",
  pitchPrompt:"Órale. A ver cómo se vería.",
  smallLine:"Espera, espera. Todo esto suena muy bien… para empresas más grandes. Somos cinco empleados. ¿De verdad esto es para un negocio de mi tamaño?",
  smallGood:"Ok, eso me hace sentido — cerca pero trabado es justo donde estoy. Sigue.",
  pricefastLine:"Antes de que sigas con todo el detalle — ¿cuánto cuesta? Directo, sin vueltas.",
  pricePrompt:"¿Cuánto cuesta?",
  priceReaction:"Cinco mil cuatrocientos noventa y nueve. Ok… es dinero serio para mi tamaño. No digo que no — pero es serio.",
  priceReactionBad:"¿Ves? Ni el número dejaste respirar. Así no sé si estás seguro de lo que cuesta.",
  obj_esposa_line:"Y hay otra cosa: mi esposa revisa conmigo los gastos grandes, y esto es un gasto grande. Tengo que verlo con ella antes de firmar cualquier cosa.",
  closeGood:"Está bien: la llamada corta con ella, el jueves en la tarde. Mándame el resumen antes para enseñárselo y que llegue con preguntas.",
  closeOk:"Sale — agéndalo y mándame el resumen.",
  closeBad:"Déjame verlo con ella y te digo."},
 objs:["obj_esposa"], flowExtra:"timing"},
fernando:{ name:"Fernando Ruiz", biz:"Taller de reparación de autos · 6 empleados · ~$600K/año", prep:"Su formulario dice que está trabado en SISTEMAS Y EQUIPO — todo pasa por él. Su hermano es socio minoritario y co-decide.", startR:7, startT:6, coDecider:"hermano", skepticismAt:null, concernKeys:[],
 L:{ greet:"Hola. Adelante — pero te aviso: todo en este taller pasa por mí, así que mi tiempo es oro.",
  qualifyAns:"Sistemas y equipo, tal cual. Todo pasa por mí: los diagnósticos difíciles, los clientes molestos, las decisiones. Trabajo 65 horas a la semana. Mi hermano es socio minoritario — las decisiones grandes las vemos entre los dos.",
  painAns:"Taller de reparación de autos, seis empleados, unos 600 mil al año. El negocio funciona — pero funciona porque yo estoy en todo. Si me enfermo una semana, esto se cae. No tengo sistemas que corran sin mí, y eso ya me está pasando factura.",
  triedAns:"Contraté a un encargado una vez — a los tres meses renunció porque yo le corregía todo encima. Escribí procedimientos en una libreta que nadie abrió jamás. Y te lo digo claro: parte del problema soy yo, que no suelto.",
  goalAns:"Un taller que corra dos semanas sin mí adentro. Un encargado real, con sistemas claros que el equipo siga. Y yo trabajando EN el negocio, no atrapado debajo de los carros.",
  gapAns:"Si nada cambia, en seis meses sigo a 65 horas, hasta el cuello, y mi hermano preguntándome hasta cuándo. Esto no es sostenible — y mi salud ya me lo dijo.",
  urgencyAns:"El mes pasado terminé en urgencias por la presión alta. El doctor me dijo que este ritmo me va a cobrar factura. Ahí dije: esto se arregla ahora o no se arregla.",
  readinessAns:"Un 7. Estoy convencido del problema. Mi freno es otro: ya intenté delegar y me salió mal. Necesito creer que esta vez el sistema sí se monta de verdad.",
  trustAns:"Un 6. Creo que necesito ayuda de fuera — desde adentro no lo he logrado en años. Lo que me falta es ver cómo se vería montado en UN taller como el mío, no en teoría.",
  pitchPrompt:"Muéstrame cómo lo montarías en mi taller.",
  pricePrompt:"¿Cuánto cuesta trabajar con ustedes?",
  priceReaction:"5,499 en total. Ok. No me espanta como número — me cuesta más un mes mío perdido que eso. Pero es una decisión que no tomo a la ligera.",
  priceReactionBad:"Tranquilo — el número no me asustó, pero que no lo dejes caer sí me dice algo.",
  obj_pensar_line:"Te voy a ser honesto: necesito pensarlo. No es el dinero. Es que quiero estar seguro de que esta vez sí voy a soltar y dejar que el sistema se monte. Ya fallé una vez en eso.",
  obj_sendinfo_line:"Mándame la información y lo veo con mi hermano. Él es socio — tiene que ver los números antes de que decidamos algo.",
  sendinfoGood:"Eso sí me funciona: el resumen armado para MI caso, y la llamada entre los tres el viernes para revisarlo con mi hermano ahí. Agéndala.",
  closeGood:"Viernes, entre los tres. Mándame el resumen antes para que mi hermano llegue leído.",
  closeOk:"Ándale — agéndalo y mándame el resumen.",
  closeBad:"Te confirmo cuando lo vea con él."},
 objs:["obj_pensar","obj_sendinfo"]}
};

var HINTS={
en:{frame:"Open with the script's frame: what you'll ask, getting clear on where he wants to be, and \"if I can help I'll show you — if I can't, I'll tell you straight.\" End with: \"Sound fair?\"",
 qualify:"Two things, plainly: confirm his constraint in his exact form words — then ask who else is part of a decision like this. Minute 2, not minute 28.",
 park:"Use the bridge: acknowledge it, park it by name, promise to answer it before any price, and ask him to hold you to it. Do NOT defend the program here.",
 pain:"Pain budget: 4 questions. Struggling with what → how long → recent example → what it cost. One topic at a time.",
 tried:"Run the prior-failure branch: what did he try, what did he actually get, why didn't it stick. Write down bought / expected / did / why it failed — Step 5 needs it.",
 goal:"Goal budget: 3. What solved feels like → who else benefits → a normal day in six months. Specifics only: numbers, hours, moments.",
 gap:"Mirror ONCE in his exact words — today vs. the goal — then: \"What happens if nothing changes?\" and \"Why haven't you been able to do this on your own?\" Let the silence work.",
 urgency:"ONE question: \"What made you book this call now?\" Thin answer? One follow-up only: \"What happens if you give it another six months?\"",
 return:"Pay off the park NOW, before any pitch: name what actually failed last time, then the mechanism that's different — in HIS situation. End by asking if that answers it.",
 readiness:"Ask readiness ONLY: 1 = okay as things are, 10 = ready to do whatever work it takes to fix THIS. Then: \"What makes it that number?\" Do not ask the trust question in the same breath.",
 trust:"SEPARATE beat: \"How convinced are you that you need outside help to fix it? What would raise that?\" His answer tells you what the pitch must prove.",
 pitch:"Template: his words for today → his words for the goal → the gap is the constraint → ONE specific first intervention in the first 4–6 weeks → who does what → how he'll know it's working → why the Accelerator fits HIS situation. No feature list.",
 diy:"Diagnose, don't rebut: ask what's stopped them solving it solo. The honest answer is usually: the tools existed; the missing piece is structure, a different angle, and someone holding the line.",
 timing:"Respect the real constraint. Diagnose it: is it hours, or is it that he can't see where this fits? Then name how the work gets built — on working calls, run by his team — and keep discovering.",
 small:"Diagnose: \"What does 'ready' look like — what would need to be true?\" Size doesn't decide fit; the problem and his capacity to act do.",
 pricefast:"Don't dodge and don't discount. One line of fit if it's missing, then the total, clean: the Accelerator, $5,499 in total — then silence.",
 price:"Fit first if you haven't said it. Then: \"For you, it's the Accelerator — $5,499 in total, for six months of implementation with us.\" Then STOP. The next screen makes you hold the silence.",
 obj_price:"Diagnose: \"Compared to what?\" Or put his own stated cost of staying stuck next to the price. The ~$30-a-day reframe is allowed now — after his reaction — beside HIS cost number. Never when the cash problem is genuinely real.",
 obj_afford:"This is real math, not a smokescreen. Diagnose: timing thing or math thing? If the cash genuinely isn't there, say so plainly and protect the business. If financing enters the conversation, it enters complete: monthly + total + rate, soft pull, no promised approval.",
 credit:"Use the dignity line word for word: nobody tells him he's approved before the partner runs it; the check is a soft pull that doesn't hurt his credit; whatever the answer, it's handled honestly. PROMISING APPROVAL HERE IS THE ONE UNFORGIVABLE MOVE.",
 obj_fin:"He asked how it gets paid. Present financing completely: monthly payments, the total, and the rate shown before he agrees to anything; pre-qualification is a soft check that doesn't affect his credit; you cannot promise an approval — nobody honest can.",
 obj_spouse:"Diagnose: \"What do you think she'll ask you — and what will your answer be?\" Then book the short three-way call before you hang up, with a one-page summary he can show her tonight. Never send him home to sell it secondhand.",
 obj_familia:"Diagnose: «¿Qué crees que te van a preguntar?» Respeta la decisión compartida. Agenda la llamada entre los tres con día y hora antes de colgar, y dale el resumen de una página para esta noche.",
 obj_think:"Diagnose the one open thing: \"What specifically would you need to get clear on for this to be a yes?\" Deal only with what he names. Then book 48 hours out to land on a yes or a no.",
 obj_pensar:"Diagnostica lo único abierto: «¿qué necesitarías tener claro para que sea un sí?» Trabaja solo lo que nombre. Luego agenda a 48 horas para aterrizar en sí o no.",
 obj_sendinfo:"Diagnose: \"What would you be looking for in it that we haven't covered?\" Send a short recap built around HIS constraint with the total price — AND book the short call to review it together. Agreeing to send info with no date is how this dies.",
 obj_esposa:"Diagnostica: «¿Qué crees que te va a preguntar?» Respeta la decisión compartida. Agenda la llamada entre los tres antes de colgar, con el resumen para compartir.",
 close:"Book it on this call: a specific day and time. Co-decider in play? It's a three-way call, plus the one-page summary tonight. Never end on \"I'll email you.\""},
es:{frame:"Abre con el encuadre del guion: qué vas a preguntar, dejar claro a dónde quiere llegar, y «si puedo ayudarte te lo muestro; si no, te lo digo directo». Cierra con: «¿Te parece justo?»",
 qualify:"Dos cosas, con naturalidad: confirma su restricción con las palabras exactas de su formulario — y pregunta quién más participa en una decisión así. Minuto 2, no minuto 28.",
 park:"Usa el puente: reconócelo, anótalo por nombre, promete responderlo antes de cualquier precio y pídele que te lo reclame si no cumples. NO defiendas el programa aquí.",
 pain:"Límite de dolor: 4 preguntas. ¿Con qué batalla? → ¿desde cuándo? → ejemplo reciente → ¿cuánto le costó? Un tema a la vez.",
 tried:"Corre la rama de intentos anteriores: qué intentó, qué obtuvo en realidad, por qué no funcionó. Anota compró / esperaba / hizo / por qué falló: el Paso 5 lo necesita.",
 goal:"Límite de meta: 3. ¿Cómo se sentiría resuelto? → ¿quién más gana? → un día normal en seis meses. Solo detalles: números, horas, momentos.",
 gap:"Espejo UNA vez con sus palabras exactas — hoy vs. la meta — y luego: «¿Qué pasa si no cambia nada?» y «¿Por qué no has podido lograrlo solo?» Deja que el silencio trabaje.",
 urgency:"UNA pregunta: «¿Qué te hizo reservar esta llamada justo ahora?» ¿Respuesta floja? Un solo seguimiento: «¿Qué pasa si le das otros seis meses más?»",
 return:"Cumple lo anotado AHORA, antes de cualquier propuesta: nombra qué falló la vez pasada y el mecanismo distinto — en SU situación. Cierra preguntando si eso lo responde.",
 readiness:"Pregunta SOLO la disposición: 1 = estoy bien como estoy, 10 = listo para hacer el trabajo que haga falta para arreglar ESTO. Luego: «¿Por qué ese número?» No juntes la pregunta de confianza en la misma respiración.",
 trust:"Momento SEPARADO: «¿Qué tan convencido estás de que necesitas ayuda de fuera para arreglarlo? ¿Qué te haría estar más convencido?» Su respuesta te dice qué tiene que probar la propuesta.",
 pitch:"Plantilla: sus palabras de hoy → sus palabras de la meta → la brecha es la restricción → UNA primera intervención concreta en las primeras 4 a 6 semanas → quién hace qué → cómo sabrá que funciona → por qué el Accelerator encaja con SU situación. Nada de listas de características.",
 diy:"Diagnostica, no rebatas: pregunta qué lo ha frenado para resolverlo solo. La respuesta honesta suele ser: las herramientas existían; lo que falta es estructura, otro ángulo y alguien que sostenga el plan.",
 timing:"Respeta la limitación real. Diagnostícala: ¿son las horas, o que no ve dónde encaja esto? Luego nombra cómo se construye el trabajo — en llamadas de trabajo, corrido por su equipo — y sigue descubriendo.",
 small:"Diagnostica: «¿Cómo se ve 'listo' para ti? ¿Qué tendría que ser verdad?» El tamaño no decide el encaje; lo deciden el problema y su capacidad de actuar.",
 pricefast:"No evadas y no descuentes. Una línea de encaje si falta, y luego el total, limpio: el Accelerator, 5,499 dólares en total — y silencio.",
 price:"Encaje primero si no lo has dicho. Luego: «Para ti, es el Accelerator — 5,499 dólares en total, por seis meses de implementación con nosotros.» Y CALLA. La siguiente pantalla te obliga a sostener el silencio.",
 obj_price:"Diagnostica: «¿Caro comparado con qué?» O pon su propio costo de seguir trabado junto al precio. El cálculo de ~30 dólares al día ya está permitido — después de su reacción — junto a SU número de costo. Nunca si el problema de dinero es real de verdad.",
 obj_afford:"Esto es matemática real, no una cortina. Diagnostica: ¿tiempo o matemáticas? Si el dinero de verdad no está, dilo claro y protege el negocio. Si entra el financiamiento, entra completo: mensual + total + tasa, consulta suave, aprobación jamás prometida.",
 credit:"Usa la frase de dignidad tal cual: nadie le dice que está aprobado antes de que el socio lo revise; la revisión es una consulta suave que no afecta su crédito; sea cual sea la respuesta, se maneja con honestidad. PROMETER LA APROBACIÓN AQUÍ ES EL ERROR IMPERDONABLE.",
 obj_fin:"Preguntó cómo se paga. Presenta el financiamiento completo: pagos mensuales, el total y la tasa visibles antes de aceptar nada; la precalificación es una consulta suave que no afecta su crédito; no puedes prometer una aprobación — nadie honesto puede.",
 obj_spouse:"Diagnostica: «¿Qué crees que te van a preguntar — y qué crees que les vas a responder?» Luego agenda la llamada corta entre los tres antes de colgar, con el resumen de una página para esta noche. Nunca lo mandes a venderlo en casa.",
 obj_familia:"Diagnostica: «¿Qué crees que te va a preguntar?» Respeta la decisión compartida: agenda la llamada entre los tres, con día y hora, antes de colgar — y el resumen de una página para que se lo muestre esta noche.",
 obj_think:"Diagnostica lo único abierto: «¿Qué necesitarías tener claro para que esto sea un sí?» Trabaja solo lo que nombre. Y agenda 48 horas para aterrizar en un sí o un no.",
 obj_pensar:"Diagnostica lo único abierto: «¿Qué necesitarías tener claro para que esto sea un sí?» Trabaja solo lo que nombre. Y agenda a 48 horas para aterrizar en un sí o un no.",
 obj_sendinfo:"Diagnostica: «¿Qué estarías buscando en esa información que no hayamos cubierto ya?» Manda un resumen corto armado alrededor de SU restricción, con el precio total — Y agenda la llamada corta para revisarlo juntos. Aceptar mandar información sin fecha es como esto se muere.",
 obj_esposa:"Diagnostica: «¿Qué crees que te va a preguntar?» Respeta que revisa los gastos grandes: agenda la llamada entre los tres antes de colgar, con el resumen para compartir.",
 close:"Agéndalo en esta llamada: día y hora concretos. ¿Hay co-decisor? Es llamada entre los tres, más el resumen de una página esta noche. Nunca termines con «te mando un correo»."}};

en:{title:"Live Role-Play Simulator",intro:"You run a full discovery call against a live prospect. Type your lines — or use the mic where your browser supports it. He softens when you run the script's beats and pushes back when you're vague, defensive, or selling. Your hidden scores (his readiness and trust) move with how you play it. At the end: a fidelity scorecard against the script.",
 how:["His form answer is in the prep note — use his exact words.","The Park is a promise: skepticism raised early must be answered before the pitch.","After you quote the price, the app makes you hold the silence. Let him react first.","Coach hint is always one tap away. Misses show up in the coach panel."],
