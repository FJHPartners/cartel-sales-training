es:{title:"Simulador de práctica en vivo",intro:"Corres una llamada de descubrimiento completa contra un prospecto en vivo. Escribe tus líneas — o usa el micrófono si tu navegador lo soporta. Él se abre cuando corres los pasos del guion y empuja cuando eres vago, defensivo o vendes de más. Sus números ocultos (disposición y confianza) se mueven con tu juego. Al final: una tarjeta de fidelidad contra el guion.",
 how:["La respuesta de su formulario está en la nota de preparación: usa sus palabras exactas.","Lo anotado es una promesa: el escepticismo temprano se responde antes de la propuesta.","Después de dar el precio, la app te obliga a sostener el silencio. Que reaccione él primero.","La pista del coach está siempre a un toque. Los errores aparecen en el panel del coach."],
 youSay:"Tú (el vendedor)",prospect:"Prospecto",coach:"COACH",hintBtn:"Pista del coach",send:"Enviar",startCall:"Empezar la llamada",micNote:"La entrada por voz no está soportada en este navegador — escribir funciona en todas partes.",voiceOn:"Voz del prospecto: SÍ",voiceOff:"Voz del prospecto: NO",silenceT:"EL PRECIO YA SALIÓ. Ahora el movimiento más difícil de la llamada:",silenceHold:"🤫 Quédate en silencio — que reaccione él",silenceSell:"Seguir vendiendo",silenceNote:"La siguiente voz en esta llamada debe ser la suya.",stage:"Paso",scores:"Disposición · Confianza",
 retry:"Repetir este escenario",drill:"Práctica de objeciones al azar",scriptBtn:"Revisar el guion",again:"Elegir otro escenario",end:"LLAMADA COMPLETA",fid:"Puntaje de fidelidad",startScores:"Inicio",endScores:"Final",topFix:"Correcciones principales",na:"n/a",bookedThree:"Llamada entre tres agendada con el co-decisor",bookedStep:"Siguiente paso con fecha agendado",noStep:"Sin siguiente paso con fecha",
 begin:"La llamada empieza. Acaba de contestar.",prepLabel:"PREPARACIÓN (de su formulario)",pickScenario:"Elige tu prospecto"}};
</script>
<script>
/* ---------- simulator engine ---------- */
var SIM=null, VOICE_ON=false;
var SR=(window.SpeechRecognition||window.webkitSpeechRecognition)||null, RECOG=null;
var CKW={tyler:["lead"],chris:["clos","estimate"],brian:["cash"],roberto:["flujo"],miguel:["clientes","referidos"],fernando:["sistemas","equipo","sistema"]};
var STAGE_NAMES={
en:{frame:"Frame",qualify:"Qualify",park:"Park the skepticism",pain:"Pain",tried:"What he's tried",goal:"Goal",gap:"The gap",urgency:"Urgency",return:"The return",readiness:"Readiness — beat 1",trust:"Trust — beat 2",pitch:"The pitch",diy:"Objection: DIY",timing:"Objection: timing",small:"Objection: too small",pricefast:"He wants the price now",price:"The price",obj_price:"Objection: price",obj_spouse:"Objection: spouse",obj_think:"Objection: think about it",obj_sendinfo:"Objection: send me the info",obj_afford:"Objection: show me the math",obj_fin:"How it gets paid",credit:"The credit moment",obj_familia:"Objection: family decision",obj_esposa:"Objection: spouse",obj_pensar:"Objection: think about it",close:"Book the next step"},
es:{frame:"Encuadre",qualify:"Calificación",park:"Anotar el escepticismo",pain:"Dolor",tried:"Lo que ya intentó",goal:"Meta",gap:"La brecha",urgency:"Urgencia",return:"El regreso prometido",readiness:"Disposición — momento 1",trust:"Confianza — momento 2",pitch:"La propuesta",diy:"Objeción: lo hago solo",timing:"Objeción: no tengo tiempo",small:"Objeción: demasiado pequeño",pricefast:"Quiere el precio ya",price:"El precio",obj_price:"Objeción: precio",obj_spouse:"Objeción: pareja",obj_think:"Objeción: pensarlo",obj_sendinfo:"Objeción: mándame la información",obj_afford:"Objeción: muéstrame las cuentas",obj_fin:"Cómo se paga",credit:"El momento del crédito",obj_familia:"Objeción: decisión familiar",obj_esposa:"Objeción: esposa",obj_pensar:"Objeción: pensarlo",close:"Agendar el siguiente paso"}};
var NUDGE={
en:{default:"Hold on — that didn't really land with me. Say it a different way.",park:"You're kind of moving past the thing I asked about. That's the thing I care about.",price:"You still haven't actually given me a number.",readiness:"I don't think you asked me anything there.",trust:"Same question back at you — what are you actually asking me?",close:"So… what happens next? Are we just leaving it here?",qualify:"Wait — before all that, what are you actually asking me?",pitch:"That's pretty general. What's the actual first thing you'd do in MY business?"},
es:{default:"Espera — eso no me cayó bien. Dilo de otra forma.",park:"Estás pasando de largo lo que te pregunté. Y eso es justo lo que me importa.",price:"Todavía no me has dado un número en realidad.",readiness:"Creo que ahí no me preguntaste nada.",trust:"Te devuelvo la pregunta: ¿qué me estás preguntando exactamente?",close:"Entonces… ¿qué sigue? ¿Lo dejamos aquí?",qualify:"Espera — antes de todo eso, ¿qué me estás preguntando?",pitch:"Eso suena muy general. ¿Qué es lo primero que harías en MI negocio, en concreto?"}};
var FRAMEACK={en:"Yeah, that sounds fair.",es:"Sí, me parece justo."};
function simFlowFor(p){
  var f=["frame","qualify"];
  if(p.skepticismAt==="qualify") f.push("park");
  f.push("pain");
  if(p.skepticismAt==="pain") f.push("park");
  if(p.flowExtra==="timing") f.push("timing");
  f.push("tried","goal","gap","urgency");
  if(p.skepticismAt) f.push("return");
  f.push("readiness","trust","pitch");
  if(p.L.diyLine) f.push("diy");
  if(p.L.smallLine){ f.push("small"); f.push("pricefast"); }
  f.push("price");
  for(var i=0;i<p.objs.length;i++) f.push(p.objs[i]);
  f.push("close");
  return f;
}
function stageTellLine(st){
  var L=SIM.P.L;
  switch(st){
    case "pitch": return L.pitchPrompt;
    case "diy": return L.diyLine;
    case "timing": return L.timingLine;
    case "small": return L.smallLine;
    case "pricefast": return L.pricefastLine;
    case "price": return L.pricePrompt;
    case "credit": return L.creditLine;
    case "obj_spouse": return L.obj_spouse_line;
    case "obj_think": return L.obj_think_line;
    case "obj_sendinfo": return L.obj_sendinfo_line;
    case "obj_afford": return L.obj_afford_line;
    case "obj_familia": return L.obj_familia_line;
    case "obj_esposa": return L.obj_esposa_line;
    case "obj_pensar": return L.obj_pensar_line;
    default: return null;
  }
}
function renderSimHome(V){
  var U=SIMUI[LANG], ps=PERSONAS[LANG];
  var h='<button class="btn ghost" onclick="go(\'home\')">'+T("backHome")+'</button><h1>🎙 '+U.title+'</h1><p class="dim small">'+U.intro+'</p>';
  h+='<div class="card"><b>'+(LANG==="es"?"Cómo funciona":"How it works")+'</b><ul class="small">';
  for(var i=0;i<U.how.length;i++) h+='<li>'+U.how[i]+'</li>';
  h+='</ul>'+(SR?"":'<p class="small" style="color:var(--gold)">'+U.micNote+'</p>')+'</div>';
  if(PROG.simBest) h+='<p class="small dim">'+U.fid+': '+PROG.simBest+'%</p>';
  h+='<h2>'+U.pickScenario+'</h2>';
  for(var k in ps){ if(!ps.hasOwnProperty(k)) continue; var p=ps[k];
    h+='<div class="card"><b>'+p.name+'</b><p class="small dim">'+p.biz+'</p><p class="small">'+p.prep+'</p><button class="btn block" onclick="simStart(\''+k+'\')">'+U.startCall+' →</button></div>';
  }
  V.innerHTML=h;
}
function simStart(key){
  var p=PERSONAS[LANG][key];
  SIM={key:key,P:p,flow:simFlowFor(p),idx:0,retries:0,R:p.startR,T:p.startT,
    flags:{},penalties:[],misses:[],log:[],coach:[],diagTotal:0,diagGood:0,ended:false,silenceMode:false};
  SIM.log.push({who:"sys",text:SIMUI[LANG].prepLabel+": "+p.prep});
  SIM.log.push({who:"pro",text:p.L.greet});
  go("sim");
}
function proSay(text){ SIM.log.push({who:"pro",text:text}); speak(text); }
function coachSay(text){ SIM.coach.push(text); }
function miss(k){ for(var i=0;i<SIM.misses.length;i++) if(SIM.misses[i]===k) return; SIM.misses.push(k); }
function penalty(k){ SIM.penalties.push(k); miss(k); }
function speak(text){
  if(!VOICE_ON||!window.speechSynthesis) return;
  try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang=(LANG==="es"?"es-ES":"en-US"); u.rate=1.02;
    var vs=window.speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){ if(vs[i].lang&&vs[i].lang.indexOf(LANG==="es"?"es":"en")===0){ u.voice=vs[i]; break; } }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function renderSim(V){
  if(!SIM){ renderSimHome(V); return; }
  var U=SIMUI[LANG];
  var h='<div class="simbar"><b>'+SIM.P.name+'</b><span class="badge">'+SIM.P.biz+'</span></div>';
  h+='<div class="simbar" style="margin-top:6px"><span class="score">'+U.stage+': <b style="color:var(--gold)">'+(STAGE_NAMES[LANG][SIM.flow[SIM.idx]]||"—")+'</b></span><span class="score">'+U.scores+': <b>'+SIM.R+'</b> · <b>'+SIM.T+'</b></span>'
   +'<button class="iconbtn" style="font-size:12px;padding:6px 10px" onclick="toggleVoice()">'+(VOICE_ON?U.voiceOn:U.voiceOff)+'</button>'
   +'<button class="iconbtn" style="font-size:12px;padding:6px 10px" onclick="simHint()">💡 '+U.hintBtn+'</button></div>';
  h+='<div class="chat" id="simChat"></div><div id="simCoach"></div><div id="simInputZone"></div>';
  V.innerHTML=h; simPaint();
}
function toggleVoice(){ VOICE_ON=!VOICE_ON; if(!VOICE_ON&&window.speechSynthesis){ try{window.speechSynthesis.cancel();}catch(e){} } go("sim"); }
function simPaint(){
  var U=SIMUI[LANG], c=$("simChat"); if(!c) return;
  var h="";
  for(var i=0;i<SIM.log.length;i++){ var m=SIM.log[i];
    if(m.who==="sys") h+='<div class="msg sys">'+esc(m.text)+'</div>';
    else if(m.who==="pro") h+='<div class="msg pro"><span class="who">'+SIM.P.name+'</span>'+esc(m.text)+'</div>';
    else h+='<div class="msg rep"><span class="who">'+U.youSay+'</span>'+esc(m.text)+'</div>';
  }
  c.innerHTML=h;
  var cb=$("simCoach");
  if(SIM.coach.length){ var last=SIM.coach[SIM.coach.length-1];
    cb.innerHTML='<details '+(SIM.coachOpen?"open":"")+'><summary>🎓 '+U.coach+' ('+SIM.coach.length+')</summary><div class="coachbox">'+SIM.coach.map(function(x){return "<p style='margin:4px 0'>"+esc(x)+"</p>";}).join("")+'</div></details>';
    cb.getElementsByTagName("details")[0].addEventListener("toggle",function(){ SIM.coachOpen=this.open; });
  } else cb.innerHTML="";
  var z=$("simInputZone");
  if(SIM.ended){ z.innerHTML=""; }
  else if(SIM.silenceMode){
    z.innerHTML='<div class="card gold" style="text-align:center"><b>'+U.silenceT+'</b><div class="silence">· · ·</div><p class="small dim">'+U.silenceNote+'</p><button class="btn block" onclick="silenceChoice(true)">'+U.silenceHold+'</button><button class="btn ghost block" onclick="silenceChoice(false)">'+U.silenceSell+'</button></div>';
  } else {
    z.innerHTML='<div class="sendrow"><textarea id="simText" rows="2" placeholder="'+(LANG==="es"?"Escribe tu línea…":"Type your line…")+'"></textarea>'
      +(SR?'<button class="iconbtn" id="micBtn" onclick="micToggle()">🎤</button>':"")
      +'<button class="btn" onclick="simSend()">'+U.send+'</button></div>'
      +(SR?"":'<p class="tiny dim">'+U.micNote+'</p>');
    var ta=$("simText"); if(ta){ ta.addEventListener("keydown",function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ simSend(); } }); }
  }
  window.scrollTo(0,document.body.scrollHeight);
}
function simHint(){
  var st=SIM.flow[SIM.idx]; var hint=HINTS[LANG][st]||HINTS[LANG].default||"";
  coachSay("💡 "+hint); simPaint();
}
function micToggle(){
  if(!SR) return;
  if(RECOG){ try{RECOG.stop();}catch(e){} RECOG=null; var b=$("micBtn"); if(b)b.className="iconbtn"; return; }
  try{
    RECOG=new SR(); RECOG.lang=(LANG==="es"?"es-ES":"en-US"); RECOG.interimResults=false; RECOG.continuous=false;
    var btn=$("micBtn"); if(btn)btn.className="iconbtn on";
    RECOG.onresult=function(ev){ var txt=""; for(var i=0;i<ev.results.length;i++) txt+=ev.results[i][0].transcript; var ta=$("simText"); if(ta){ ta.value=(ta.value?ta.value+" ":"")+txt; } };
    RECOG.onend=function(){ RECOG=null; var b=$("micBtn"); if(b)b.className="iconbtn"; };
    RECOG.onerror=function(){ RECOG=null; var b=$("micBtn"); if(b)b.className="iconbtn"; };
    RECOG.start();
  }catch(e){ RECOG=null; }
}
</script>
<script>
/* ---------- simulator: evaluation, flow, scorecard ---------- */
function FB(en,es){ return LANG==="en"?en:es; }
function penOnce(k,msg){ if(SIM.flags["pen_"+k])return; SIM.flags["pen_"+k]=true; SIM.penalties.push(k); miss(k); if(msg)coachSay("⚠ "+msg); }
function simPaint(){
  var U=SIMUI[LANG], c=$("simChat"); if(!c) return;
  var h="";
  for(var i=0;i<SIM.log.length;i++){ var m=SIM.log[i];
    if(m.who==="sys") h+='<div class="msg sys">'+esc(m.text)+'</div>';
    else if(m.who==="pro") h+='<div class="msg pro"><span class="who">'+esc(SIM.P.name)+'</span>'+esc(m.text)+'</div>';
    else h+='<div class="msg rep"><span class="who">'+U.youSay+'</span>'+esc(m.text)+'</div>';
  }
  c.innerHTML=h;
  var cb=$("simCoach");
  if(SIM.coach.length){
    var last=SIM.coach[SIM.coach.length-1];
    cb.innerHTML='<div class="coachbox"><b>🎓 '+U.coach+':</b> '+esc(last)+'</div>'
      +(SIM.coach.length>1?'<details><summary>'+(LANG==="es"?"Todo el registro del coach":"Full coach log")+' ('+SIM.coach.length+')</summary><div class="coachbox">'+SIM.coach.map(function(x){return "<p style='margin:4px 0'>"+esc(x)+"</p>";}).join("")+'</div></details>':"");
  } else cb.innerHTML="";
  var z=$("simInputZone");
  if(SIM.ended){ /* end screen rendered separately */ }
  else if(SIM.silenceMode){
    z.innerHTML='<div class="card gold" style="text-align:center"><b>'+U.silenceT+'</b><div class="silence">· · ·</div><p class="small dim">'+U.silenceNote+'</p><button class="btn block" onclick="silenceChoice(true)">'+U.silenceHold+'</button><button class="btn ghost block" onclick="silenceChoice(false)">'+U.silenceSell+'</button></div>';
  } else {
    z.innerHTML='<div class="sendrow"><textarea id="simText" rows="2" placeholder="'+(LANG==="es"?"Escribe tu línea… (Ctrl+Enter para enviar)":"Type your line… (Ctrl+Enter to send)")+'"></textarea>'
      +(SR?'<button class="iconbtn" id="micBtn" onclick="micToggle()">🎤</button>':"")
      +'<button class="btn" onclick="simSend()">'+U.send+'</button></div>'
      +(SR?"":'<p class="tiny dim">'+U.micNote+'</p>');
    var ta=$("simText"); if(ta){ ta.addEventListener("keydown",function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ simSend(); } }); }
  }
  var stEl=document.querySelector(".simbar .score b"); /* stage label refresh handled on render */
  window.scrollTo(0,document.body.scrollHeight);
}
function refreshSimHead(){
  var bars=document.querySelectorAll(".simbar .score");
  if(bars.length>=2){ bars[0].innerHTML=SIMUI[LANG].stage+': <b style="color:var(--gold)">'+(STAGE_NAMES[LANG][SIM.flow[SIM.idx]]||"—")+'</b>'; bars[1].innerHTML=SIMUI[LANG].scores+': <b>'+SIM.R+'</b> · <b>'+SIM.T+'</b>'; }
}
function simSend(){
  var ta=$("simText"); if(!ta) return;
  var t=ta.value.replace(/\s+/g," ").trim(); if(!t) return;
  SIM.log.push({who:"rep",text:t});
  var P=PAT[LANG], st=SIM.flow[SIM.idx];
  /* global traps */
  if(HAS(t,P.leverage)) penOnce("scoreLeverage",FB("You used his commitment number as leverage. That number is for your understanding — the moment it becomes a weapon, every future answer gets guarded.","Usaste su número de compromiso como palanca. Ese número es para que tú lo entiendas: en el momento en que se vuelve un arma, cada respuesta futura se vuelve cuidada."));
  if(HAS(t,P.discount)) penOnce("discount",FB("No discounts on the call. The price is the price — money friction is answered with value, complete terms, or a dated step.","Sin descuentos en la llamada. El precio es el precio: la fricción de dinero se responde con valor, condiciones completas o un paso con fecha."));
  if(ISPROMISE(t)&&st!=="credit") penOnce("promisedApproval",FB("You promised an approval outcome. Nobody honest can — the provider decides. That one line can burn the whole call.","Prometiste un resultado de aprobación. Nadie honesto puede: la decide el proveedor. Esa sola frase puede quemar la llamada entera."));
  if(HAS(t,P.financing)){ SIM.flags.fin=true; if(!SIM.flags.priceGiven) SIM.flags.finEarly=true;
    if(HAS(t,P.finMonthly)&&HAS(t,P.finTotal)&&HAS(t,P.finRate)&&HAS(t,P.finSoft)) SIM.flags.finComplete=true; }
  if(HAS(t,P.daily)){
    if(!SIM.flags.priceGiven){ SIM.flags.dailyBad=true; penOnce("dailyEarly",FB("The $30-a-day line before the price is out is leading with the discount frame. Total first — the daily reframe is backup, after his first reaction.","La línea de los 30 al día antes de que salga el precio es abrir con el marco de descuento. Total primero: el cálculo diario es respaldo, después de su primera reacción.")); }
    else if(st.indexOf("obj_")===0||st==="close"){ SIM.flags.dailyOk=true; }
  }
  var r=evalStage(st,t);
  if(r.fb) coachSay((r.q===2?"✓ ":r.q===1?"◐ ":"✗ ")+r.fb);
  var retryable={frame:1,qualify:1,park:1,readiness:1,trust:1,price:1,obj_fin:1,close:1};
  if(r.q===0&&SIM.retries<1&&retryable[st]&&!SIM.flags.priceNever){
    SIM.retries++;
    proSay(NUDGE[LANG][st]||NUDGE[LANG].default);
    simPaint(); refreshSimHead(); return;
  }
  SIM.retries=0;
  if(r.pro) proSay(r.pro);
  if(st==="price"&&SIM.flags.priceGiven&&!SIM.silenceMode&&!SIM.ended){ SIM.silenceMode=true; simPaint(); refreshSimHead(); return; }
  advanceSim();
}
function advanceSim(){
  SIM.idx++;
  /* Brian/Roberto: credit surfaces only after financing is on the table */
  if(SIM.flow[SIM.idx]==="close"&&SIM.P.creditAfterFinancing&&SIM.flags.fin&&!SIM.flags.creditDone&&SIM.flow.indexOf("credit")<0){
    SIM.flow.splice(SIM.idx,0,"credit");
  }
  if(SIM.idx>=SIM.flow.length){ simEnd(); return; }
  var st=SIM.flow[SIM.idx];
  if(st==="price"&&SIM.flags.priceGiven){ SIM.silenceMode=true; simPaint(); refreshSimHead(); return; }
  var line=stageTellLine(st);
  if(line) proSay(line);
  simPaint(); refreshSimHead();
}
function silenceChoice(held){
  SIM.flags.silence=held; SIM.silenceMode=false;
  if(held){ coachSay("✓ "+FB("Silence held. The next voice was his — that's how a price moment is supposed to work.","Silencio sostenido. La siguiente voz fue la suya: así funciona un momento de precio.")); }
  else { penOnce("silence",FB("You sold into the silence. The number never got to land — watch his reaction cool.","Vendiste dentro del silencio. El número nunca cayó — mira cómo se enfría su reacción.")); SIM.T=Math.max(0,SIM.T-1); }
  proSay(held?SIM.P.L.priceReaction:SIM.P.L.priceReactionBad);
  advanceSim();
}
function evalStage(st,t){
  var P=PAT[LANG], L=SIM.P.L, F=SIM.flags, q=1, fb="", pro=null;
  var isq=t.indexOf("?")>=0||t.indexOf("¿")>=0;
  switch(st){
   case "frame":
     if(HAS(t,P.frame)&&isq){ q=2; fb=FB("Frame set: he'll let you lead. That agreement runs the rest of the call.","Encuadre puesto: te deja llevar la llamada. Ese acuerdo sostiene todo lo demás."); }
     else if(HAS(t,P.frame)){ q=1; fb=FB("Partial frame — end it with the fairness question and wait for the yes.","Encuadre parcial: ciérralo con la pregunta de justicia y espera el sí."); }
     else { q=0; fb=FB("No frame. Open the script's way: questions, clarity, \"if I can help I'll show you; if I can't, I'll tell you straight\" — \"Sound fair?\"","Sin encuadre. Abre como dice el guion: preguntas, claridad, «si puedo ayudarte te lo muestro; si no, te lo digo directo» — «¿Te parece justo?»"); }
     pro=FRAMEACK[LANG]; break;
   case "qualify":
     var cd=HAS(t,P.codecider), cc=HAS(t,CKW[SIM.key]||[]);
     if(cd){ F.codeciderEarly=true; }
     if(cc&&cd){ q=2; fb=FB("Constraint confirmed in his words AND the co-decider question asked at minute 2. The close just got easier.","Restricción confirmada con sus palabras Y la pregunta del co-decisor al minuto 2. El cierre se acaba de hacer más fácil."); }
     else if(cc||cd){ q=1; fb=cc?FB("Constraint confirmed — but ask who else is part of this decision NOW, not at the close.","Restricción confirmada — pero pregunta quién más participa en la decisión AHORA, no en el cierre."):FB("Co-decider asked — also confirm his constraint in the exact words from his form.","Co-decisor preguntado — confirma también su restricción con las palabras exactas de su formulario."); }
     else { q=0; fb=FB("Qualify: confirm his constraint in his form words and ask who else is part of a decision like this.","Califica: confirma su restricción con las palabras de su formulario y pregunta quién más participa en una decisión así."); }
     if(!cd&&SIM.P.coDecider) miss("codecider");
     pro=L.qualifyAns; break;
   case "park":
     if(HAS(t,P.park)){ q=2; F.parked=true; SIM.T=Math.min(10,SIM.T+1); fb=FB("Parked — with a named return before any price, and he gets to hold you to it. Trust just went UP.","Anotado — con un regreso nombrado antes de cualquier precio, y él puede reclamártelo. La confianza acaba de SUBIR."); pro=L.parkAckGood; }
     else if(HAS(t,P.defend)){ q=0; F.parked=false; miss("park"); penOnce("rebut"); fb=FB("You defended the program in minute 3. That's a debate, not discovery — and his guard just went up.","Defendiste el programa al minuto 3. Eso es un debate, no descubrimiento — y su guardia acaba de subir."); pro=L.parkAckBad; }
     else { q=0; F.parked=false; miss("park"); fb=FB("You moved past his skepticism without naming it. An unparked objection sits open under the whole call.","Pasaste su escepticismo sin nombrarlo. Una objeción sin anotar queda abierta bajo toda la llamada."); pro=L.parkAckBad; }
     break;
   case "pain":
     if(isq){ q=HAS(t,["cost","long","example","cuánto","cuanto","desde cuándo","desde cuando","how long","last time"])?2:1; fb=FB("Pain underway. Keep to the budget: what, how long, recent example, what it cost.","Dolor en marcha. Mantén el límite: qué, desde cuándo, ejemplo reciente, cuánto le costó."); }
     else { q=0; fb=FB("Discovery runs on questions. Ask about the pain — what, how long, a recent example, the cost.","El descubrimiento corre con preguntas. Pregunta por el dolor: qué, desde cuándo, un ejemplo reciente, el costo."); }
     pro=L.painAns; break;
   case "timing":

     else if(fc>=3){ q=1; F.pitchSpecific=false; miss("featureDump"); penalty("featureDump"); fb=FB("That's a feature list — sales, marketing, content, systems… Generic pitches collapse trust after specific discovery. Name ONE first intervention instead.","Eso es una lista de características: ventas, marketing, contenido, sistemas… Las propuestas genéricas colapsan la confianza después de un descubrimiento específico. Nombra UNA primera intervención."); }
     else { q=1; F.pitchSpecific=false; fb=FB("Too general. The template: his words → ONE first intervention in 4–6 weeks → who does what → how he'll know it's working.","Muy general. La plantilla: sus palabras → UNA primera intervención en 4 a 6 semanas → quién hace qué → cómo sabrá que está funcionando."); }

   case "diy":
     SIM.diagTotal++;

   case "small":

   case "pricefast":
     if(/5,?499/.test(t)){ F.priceGiven=true; F.priceExact=HAS(t,P.finTotal); q=2; fb=FB("He asked, you answered — clean and direct. Now hold what's next: the silence.","Preguntó y respondiste: limpio y directo. Ahora sostén lo que sigue: el silencio."); }

     if(/5,?499/.test(t)){

       q=2; fb=FB("Price is out, total first. Now the app holds you to the hardest part: silence.","El precio salió, total primero. Ahora la app te sostiene en lo más difícil: el silencio.");

     } else if(/\$\s?\d|dólares|dolares|\d{3,}/.test(t)&&HAS(t,["month","mes","monthly","mensual"])){ q=0; miss("price"); fb=FB("Monthly-first is not the price drop. Total first: the Accelerator — $5,499 in total. Then silence.","Mensual primero no es dar el precio. Total primero: el Accelerator — 5,499 dólares en total. Y silencio."); pro=null; }

     if(isq&&HAS(t,["compared","comparado","qué","what","cuál","which"])){ q=2; SIM.diagGood++; fb=FB("Diagnosed — \"compared to what?\" puts his two numbers side by side: the price, and the cost of staying stuck HE stated.","Diagnosticado: «¿comparado con qué?» pone sus dos números lado a lado: el precio, y el costo de seguir trabado que ÉL nombró."); }

en:{park:"Park the early skepticism: acknowledge it, name the moment you'll answer it (before any price), and get his \"hold me to it.\"",return:"Return to the parked objection BEFORE the pitch — name what failed last time and the different mechanism, in his situation.",codecider:"Ask who else is part of the decision at minute 2. Never let a co-decider ambush the close.",beats:"Ask readiness and trust as two separate beats — readiness first, let him finish, then trust. One breath blurs both.",transition:"Use the scripted bridge into the pitch: \"That's exactly what I needed to know. Let me show you how we'd actually fix this…\"",price:"Quote the price exactly: the Accelerator — $5,499 in total. Total first, nothing before it, nothing after it.",silence:"After the price, stop talking. Selling into the silence makes the number feel unsafe.",dailyEarly:"Never lead with $30 a day. It's the backup AFTER his first reaction, next to HIS stated cost — or not at all.",dailyBad:"Don't run the daily frame against a genuinely real cash problem. Go to complete financing terms or a dated step.",finIncomplete:"Financing is presented complete: monthly + total + rate together, the soft pull explained, terms only from the live enrollment link.",finEarly:"Financing belongs after his first price reaction — not as pitch decoration.",promisedApproval:"NEVER promise approval. The provider decides. The dignity line exists for exactly this moment.",dignity:"When he raises his own credit, use the dignity line word for word — in testing it was the single biggest trust moment of the call.",featureDump:"Feature lists don't close. One specific first intervention, in his kind of business, with who-does-what and a measure.",rebut:"Diagnose with a question before responding. Rebutting starts arguments you can't win.",painLeverage:"Never drag his pain back as pressure. His stated cost is his comparison — not your lever.",scoreLeverage:"Never use his commitment number as leverage, in any form, ever."
