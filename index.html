# Discovery Call Script v2 — The Cashflow Cartel (EN)
### For the sales team taking booked calls (30 minutes)

Framework: Brian Mark's sequence, kept exactly — **Pain → Goal → Gap → Urgency → Commitment → Pitch the transformation.** v2 changes are structure and discipline only, from team review and live role-play testing (Oct 31, 2026):

- **Pre-call prep is mandatory** — never read an answer off the form you haven't actually written down.
- **Qualification up front** — who else is part of this decision comes early, not as an ambush at the end.
- **Discovery has a clock** — question budgets, a compression path, and a hard move to the pitch.
- **Skepticism gets parked and answered** — on purpose, at a named moment, before price.
- **The commitment number measures readiness to do the work** — and a second question measures trust. Neither number is ever used as leverage.
- **The pitch is a template, not a feature list** — their words, one specific first intervention, who does what, how they'll know.
- **Objections are diagnosed, not rebutted** — full bank in the Objection Cheat Sheet.

> His rule that still runs the whole call: "Nobody cares about your product. Nobody cares about you. They only care about themselves. Your only job is to figure out them — and whether you can get them to their goals."

**Talk ratio:** they talk ~55–60%. You ask, listen, take notes. Short acknowledgments ("Got it." / "Makes sense.") — do NOT repeat their whole answer back at every step. You mirror **once**, at the Step 3 summary, in their exact words.

---

## BEFORE THE CALL — mandatory prep block (2 minutes, not optional)

Open the call sheet and write, in ink, before you dial:

1. Their name and business.
2. Their #1 constraint — **in the phrasing from their form** (never paraphrase, never trust memory).
3. Whether they watched the pre-call video.

If you can't fill line 2, you are not ready to dial. Step 0 reads from this sheet.

**Route check:** if their form says they do NOT own a business yet, this is not a sales call — run the short redirect: be warm, point them to the free guide and the community, end in 5 minutes. Do not pitch paid programs.

---

## Step 0 — Open and frame (0:00–2:00)

> "Hey [Name], this is [You] with The Cashflow Cartel. Thanks for booking. Here's how these calls work: I'll ask you some questions about your business and where you're stuck, we'll get clear on where you want to be, and if I can actually help you get there, I'll show you what working with us looks like. If I can't, I'll tell you straight and point you the right way. Sound fair?"

Wait for the yes. That agreement runs the rest of the call.

Then straight into qualification — two questions, asked plainly, no apology:

> "Quick basics first so I don't waste your time: you told us on your form you're most stuck on [their constraint, their exact words from prep line 2] — is that still the main thing?"
> "And when we get to the end of this and it makes sense — **who else is part of a decision like this for you?** A partner, a spouse, someone in the business?"

Their answer goes on the call sheet. It decides how you close (see Step 8) — you will never be surprised by it later.

## Step 1 — Pain (2:00–9:00) — budget: 4 questions max

> "**What are you struggling with?** Tell me about [their constraint] in your business right now."
> "**How long has it been like this?**"
> "Give me a recent example — when did it bite last?"
> "**What did that cost you?** Last month, roughly, in dollars or in hours."

Then ONE personal-impact question — only if they haven't already gone there themselves:
> "How is this landing outside the business — at home, on your time, on your stress?"

*(Role-play finding: if they volunteer the personal impact on their own, do NOT ask it again — asking twice exposes the technique and kills trust.)*

**Prior-failure branch — always run it once they've named the pain:**
> "What have you already tried to fix this?"
> "What did you actually get from that — what happened?"
> "Why do you think it didn't stick?"

Write down what they bought, what they expected, what they did, and why it failed. This is the raw material for the Step 5 return.

**Early-skepticism bridge — use it the moment they challenge you** ("I've been burned before," "Is this another course?"):
> "That's fair — and I'm glad you said it now instead of at the end. Let me park that: before I show you anything or talk about any price, we'll come back to exactly that, because what we do is specifically built to not be that. Hold me to it — if I don't answer it, call it out. Fair?"

Then keep going with discovery. The park is a promise — Step 5 pays it off.

## Step 2 — The goal, solved (9:00–13:00) — budget: 3 questions

> "Flip it around. **What would it feel like to have this completely solved?**"
> "**Who else benefits** when this is fixed?" *(Ask only if it hasn't already come up.)*
> "**Six months from now, what does a normal day actually look like?** Walk me through it."

Specifics only — numbers, hours, moments. Vague goals don't close; pictured ones do.

## Step 3 — Widen the gap (13:00–17:00)

**The ONE mirror — this is the only full summary of the call:**
> "So let me make sure I've got this. Today it's [their pain, in their exact words — no added drama, no bigger emotion than they used]. And where you want to be is [their goal, in their exact words]. Did I get that right?"

Their yes (or correction) locks the two pictures in.

> "**What happens if nothing changes?** Where are you in six months?"
> "**Why haven't you been able to do this on your own so far?**"

Let the silence work. Don't rescue them from the gap — the gap creates the decision.

**Bridge out (use it — never let a strong gap answer hang in silence):**
> "Okay. That's clear. One more thing before I show you anything…"

## Step 4 — Urgency (17:00–19:00) — ONE question

> "**What made you book this call now?**"

That's the question. If the answer is thin, ONE follow-up only:
> "What happens if you give it another six months?"

Do not ask three versions of the same question — it reads as pressure and costs trust.

## Step 5 — Return to the parked objection, then commitment (19:00–22:00)

**If anything was parked in Step 1, pay it off now, before any pitch:**
> "I promised we'd come back to [their concern, their words]. Here's the honest answer: what went wrong there was [name the failure mode from their prior-failure answers]. What we do differently is [the mechanism, in their situation — e.g. 'your first fix is built with you, in your business, and we measure it weekly — it's not videos you watch alone']. Does that actually answer it, or is there a piece I'm missing?"

Do not proceed to the pitch until they've confirmed it's answered — or told you it isn't (then handle it with the cheat sheet, not with the pitch).

**The commitment test — reframed (Brian's test, tightened):**
> "Before I show you anything: on a scale of 1 to 10 — 1 being 'I'm okay with things as they are' and 10 being 'I'm ready to do whatever work it takes to fix THIS' — where are you?"
> "**What makes it that number?**"
> "And separately — **how convinced are you that you need outside help to fix it?** What would raise that?"

The first number = readiness to do the work. The second = trust. The pitch must answer the second number's gap.

**Ask them as two separate beats** — readiness first, let them finish, THEN the trust question. Merging them into one breath blurs both answers (v2 role-play finding).

**Transition into the pitch — use this line, don't improvise the bridge:**
> "That's exactly what I needed to know. Let me show you how we'd actually fix this…"

**Gates:**
- **Readiness 8–10:** pitch (Step 6).
- **Readiness 5–7 or trust low:** ask what specifically is missing. If it's information, the pitch answers it — proceed. If it's genuinely "not now," don't drop a price — offer the community and book a follow-up.
- **Under 5:** disqualify kindly: "Based on that, the paid programs aren't the right fit yet. Stay close through the free guide and the community — when this becomes a 9 or 10 for you, we'll be here." End warm.

## Step 6 — Pitch the transformation (22:00–26:00)

Slides go up ONLY now (never during discovery). Fill in the template — no feature lists, ever:

> "Here's the picture you gave me. Today: [their pain, their words]. Six months from now, you want [their goal, their words]. The gap between those two is [their constraint]."
> "So the FIRST thing we'd do — in the first four to six weeks — is **[one specific first intervention, in their kind of business]**."
> Example shape: "For you that means we rebuild how leads get followed up: [who does what — 'you bring your list, we build the follow-up sequence with you on the working calls, and your team runs it']. **You'll know it's working when [measure — e.g. 'every new lead gets touched five times in seven days, and you can see it in the tracker'].**"
> "That's step one. The program around it is implementation and accountability across sales, marketing, content, systems and AI — in that order, driven by your constraint, not a curriculum you watch alone."

**"Why this fits YOUR situation" comes BEFORE any price comparison:**
> "The reason I'm putting you in front of [Accelerator] specifically is [their situation: the constraint, the support they said they need, the timeline they gave you]."

**One recommendation, routed by SUPPORT NEED (never by the commitment number):**
- **Accelerator — $5,499 total, 6 months.** The default for a qualified owner: implementation + accountability, group working calls, their work reviewed.
- **Elite — $9,950 total, 12 months.** For the owner whose situation calls for the highest level of access and direct support over a full year. Present only when the support need is genuinely there.
- **The Cartel community on Skool — $197/month.** The starter lane: "Best for exploring the framework before committing to implementation." Downsell only — never the lead pitch to a qualified owner.

**Drop the price cleanly, total first, then STOP TALKING:**
> "For you, it's the Accelerator — $5,499 in total, for six months of implementation with us. [PAUSE. Let them react first.]"

**Only after their first reaction**, if money is the friction, the daily reframe is the backup — never the lead:
> "Put against the other number: you told me staying stuck is costing you [their Step 1 cost]. The Accelerator works out to about $30 a day over the six months — and unlike the leak, it stops when the program ends."

## Step 7 — Terms and financing (26:00–28:00)

> "Two ways to start: pay in full today, or — if cash flow is the real constraint — we work with a financing partner. Qualified buyers can split it into monthly payments; you'd see the monthly amount, the total, and the rate before you agree to anything, and the pre-qualification is a soft check — it doesn't affect your credit. I can't promise an approval — nobody honest can — but you'll know exactly where you stand before you commit to anything."

Default to a term closer to the program length when they ask about options. *[Team note: quote financing terms only from the current enrollment link — confirm it's live with Alejandro before your first calls. Never quote a specific monthly figure or APR off-script.]*

**If THEY raise their credit, use this line word for word — dignity, no promises:**
> "I appreciate you saying that straight. Here's my promise: nobody here tells you you're approved before the partner actually runs it — and the check is a soft pull, so asking doesn't hurt your credit. Whatever the answer comes back, we deal with it honestly from there."

**Take enrollment on the call.** Full objection bank in the Objection Cheat Sheet — diagnose with the question first; never rebut, never return to pain questions to pressure, never use their commitment number against them.

## Step 8 — Close: a dated next step, booked on the call (28:00–30:00)

**If yes:** complete enrollment/payment on the call, confirm their email out loud, and state exactly what happens next: "You'll get a confirmation email, then your onboarding details within one business day. Your first step will be [the first intervention from Step 6]."

**If a co-decider exists (from Step 0):** never send them off to "sell it at home." Book the short three-way call before hanging up and give them something to share: "Let's get [partner] on a short call with us — [day/time] — so they hear it from us, not second-hand. I'll also send you a one-page summary you can show them tonight."

**If not yet:** book the follow-up on Calendly before you hang up. Never end on "I'll email you."

## After the call — same day, two actions

1. **Mirror recap (same day, email or text):** their words back to them, no pitch — "You said today it's [pain], and the goal is [goal]. [The first intervention] is where we'd start. Next step: [booked date/time]." Fast, short, in their language.
2. **Log it:** outcome/stage (Captured → Contacted → Engaged → Scheduled → Closed), readiness number, trust answer, their exact pain/goal words, any parked objection and how it was answered, the booked next step. The next rep who touches this lead needs all of it.

---

## COMPRESSION PATH — when discovery runs long or they book a short call

If you're at minute 15 and not past Step 3, cut to this order and do not skip the pitch:

1. Recent example + its dollar cost (Step 1)
2. "What happens if nothing changes?" (Step 3)
3. "Why haven't you been able to do this on your own?" (Step 3)
4. "What made you book this call now?" (Step 4)
5. Readiness + trust questions (Step 5) → pitch template (Step 6) → dated next step (Step 8)

Discovery that never reaches a pitch helps nobody — not them, not you.

---

### One-screen cheat sheet (v2)
0. **Prep** — Their constraint in THEIR words, written before you dial. No business = redirect, no pitch.
1. **Frame + qualify** — Fair? → Who else is part of this decision?
2. **Pain (4 max)** — Struggling with what? How long? Recent example + cost? Tried what — why did it fail? Skepticism → park it, promise the return.
3. **Goal (3 max)** — Solved feels like what? Six months, a normal day?
4. **Gap** — Mirror ONCE, their words. Nothing changes → ? On your own → why not?
5. **Urgency (1)** — What made you book this call NOW?
6. **Return + commitment** — Answer the parked objection FIRST. Readiness 1–10 (work) + trust question. Never leverage either number.
7. **Pitch** — Template: their words → ONE first intervention → who does what → the measure. Fit before price. Total price, then silence.
8. **Terms** — Financing after the first price reaction; monthly + total + rate together; no promised approvals.
9. **Close** — Dated next step booked on the call. Co-decider = three-way call + shareable summary.
10. **After** — Same-day mirror recap + full log.

*Source: framework and core questions from Brian Mark's sales reel (Oct 2026); v2 structure graded against live role-play findings, Oct 31, 2026. Objection handling: the Objection Cheat Sheet.*

# Guion de llamada de descubrimiento v2 — The Cashflow Cartel (ES)
### Para el equipo de ventas en llamadas reservadas (30 minutos)

Marco: la secuencia de Brian Mark, intacta — **Dolor → Meta → Brecha → Urgencia → Compromiso → Presentar la transformación.** Los cambios de la v2 son de estructura y disciplina, salidos de la revisión del equipo y de las prácticas con bots del 31 de octubre de 2026:

- **La preparación es obligatoria** — nunca leas en la llamada una respuesta que no hayas escrito antes.
- **La calificación va al principio** — quién más participa en la decisión se pregunta temprano, no como sorpresa al final.
- **El descubrimiento tiene reloj** — límite de preguntas por paso, ruta corta, y llegada obligatoria a la propuesta.
- **El escepticismo se anota y se responde** — a propósito, en un momento con nombre, antes del precio.
- **El número de compromiso mide las ganas de hacer el trabajo** — y una segunda pregunta mide la confianza. Ningún número se usa jamás como presión.
- **La propuesta es una plantilla, no una lista de características** — sus palabras, una primera intervención concreta, quién hace qué, cómo se mide.
- **Las objeciones se diagnostican, no se rebaten** — banco completo en la Guía de objeciones.

> La regla de Brian que sigue mandando en toda la llamada: a nadie le importa tu producto ni le importas tú. Solo les importa ellos mismos. Tu único trabajo es entenderlos — y saber si puedes llevarlos a su meta.

**Proporción de conversación:** ellos hablan ~55–60%. Tú preguntas, escuchas y anotas. Confirmaciones cortas ("Claro." / "Entiendo.") — NO repitas su respuesta completa en cada paso. El resumen completo se hace **una sola vez**, en el Paso 3, con sus palabras exactas.

---

## ANTES DE LA LLAMADA — bloque de preparación obligatorio (2 minutos)

Abre la ficha de la llamada y escribe, antes de marcar:

1. Su nombre y su negocio.
2. Su restricción #1 — **con las palabras exactas de su formulario** (nunca de memoria, nunca parafraseado).
3. Si vio el video previo a la llamada.

Si la línea 2 está vacía, no estás listo para marcar. El Paso 0 se lee de esta ficha.

**Revisión de ruta:** si su formulario dice que TODAVÍA no tiene negocio, esto no es una llamada de ventas — haz la derivación corta: sé amable, dirígelo a la guía gratuita y a la comunidad, y cierra en 5 minutos. No propongas programas pagos.

---

## Paso 0 — Apertura y encuadre (0:00–2:00)

> "Hola [Nombre], soy [Tu nombre], de The Cashflow Cartel. Gracias por reservar. Te explico cómo funcionan estas llamadas: te voy a hacer preguntas sobre tu negocio y sobre dónde estás trabado, vamos a dejar claro a dónde quieres llegar, y si de verdad puedo ayudarte a llegar, te muestro cómo sería trabajar con nosotros. Si no puedo, te lo digo directo y te oriento hacia otro lado. ¿Te parece justo?"

Espera el sí. Ese acuerdo sostiene el resto de la llamada.

Y enseguida la calificación — dos preguntas, dichas con naturalidad:

> "Dos cosas rápidas para no hacerte perder el tiempo: en tu formulario pusiste que donde más estás trabado es en [su restricción, con sus palabras exactas de la línea 2] — ¿sigue siendo eso lo principal?"
> "Y cuando lleguemos al final y esto tenga sentido — **¿quién más participa en una decisión así?** ¿Tu pareja, un socio, alguien del negocio?"

Su respuesta va a la ficha. Define cómo cierras (ver Paso 8) — nunca te va a sorprender al final.

## Paso 1 — Dolor (2:00–9:00) — máximo 4 preguntas

> "**¿Con qué estás batallando?** Cuéntame cómo está [su restricción] en tu negocio hoy."
> "**¿Desde cuándo está así?**"
> "Dame un ejemplo reciente — ¿cuándo te pegó la última vez?"
> "**¿Cuánto te costó?** El mes pasado, más o menos, en dólares o en horas."

Después, UNA sola pregunta de impacto personal — solo si él no llegó solo a ese tema:
> "¿Y esto cómo te está afectando también fuera del negocio? ¿En tu casa, tu tiempo, tu tranquilidad?"

*(Hallazgo de las prácticas: si él solo menciona el impacto personal, NO vuelvas a preguntarlo — preguntar dos veces delata la técnica y rompe la confianza.)*

**Rama de intentos anteriores — córrela siempre, una vez que nombró el dolor:**
> "¿Qué has intentado ya para arreglar esto?"
> "¿Y qué pasó con eso? ¿Qué obtuviste en realidad?"
> "¿Por qué crees que no funcionó?"

Anota qué compró, qué esperaba, qué hizo de verdad y por qué falló. Ese es el material del regreso en el Paso 5.

**Puente para el escepticismo temprano — úsalo en el momento en que te cuestione** ("ya me quemé antes", "¿esto es otro curso más?"):
> "Es justo — y qué bueno que lo dices ahora y no al final. Lo anoto aquí: antes de mostrarte cualquier cosa o hablar de precios, volvemos a ese punto, porque lo que hacemos está pensado justamente para no ser eso. Te lo cumplo — si no te lo respondo, me lo reclamas. ¿Trato hecho?"

Y sigues con el descubrimiento. La anotación es una promesa — el Paso 5 la cumple.

## Paso 2 — La meta, resuelta (9:00–13:00) — máximo 3 preguntas

> "Ahora míralo al revés. **¿Cómo se sentiría tener esto completamente resuelto?**"
> "**¿Qué cambiaría para ti en la práctica?**" *(Solo si todavía no apareció quién más se beneficia:)* "**¿Quién más gana cuando esto se arregla?**"
> "**De aquí a seis meses, ¿cómo se ve un día normal?** Cuéntame ese día."

Solo detalles concretos — números, horas, momentos. Las metas vagas no cierran; las que se pueden ver, sí.

## Paso 3 — Abrir la brecha (13:00–17:00)

**El ÚNICO resumen completo de la llamada:**
> "Déjame ver si lo tengo claro. Hoy la situación es [su dolor, con sus palabras exactas — sin agregarle drama ni más emoción de la que él usó]. Y a donde quieres llegar es [su meta, con sus palabras]. ¿Lo dije bien?"

Su sí (o su corrección) fija las dos imágenes.

> "**¿Qué pasa si no cambia nada?** ¿Dónde estás en seis meses?"
> "**¿Por qué no has podido lograrlo solo hasta ahora?**"

Deja que el silencio trabaje. No lo rescates de la brecha — la brecha es lo que crea la decisión.

**Puente de salida (úsalo — nunca dejes una buena respuesta de brecha colgando en silencio):**
> "Perfecto. Eso quedó claro. Una cosa más antes de mostrarte algo…"

## Paso 4 — Urgencia (17:00–19:00) — UNA sola pregunta

> "**¿Qué te hizo reservar esta llamada justo ahora?**"

Esa es la pregunta. Si la respuesta es floja, UN solo seguimiento:
> "¿Qué pasa si le das otros seis meses más?"

No preguntes tres versiones de lo mismo — se siente como presión y cuesta confianza. Nada de "darle largas": si él lo dice, úsalo tú también con sus palabras.

## Paso 5 — El regreso prometido y el compromiso (19:00–22:00)

**Si algo quedó anotado en el Paso 1, cúmplelo ahora, antes de cualquier propuesta:**
> "Te prometí que volvíamos a [su preocupación, con sus palabras]. Te respondo directo: lo que falló ahí fue [el modo de fallo que salió de sus respuestas]. Lo que hacemos distinto es [el mecanismo, en su situación — por ejemplo: 'tu primer arreglo se construye contigo, dentro de tu negocio, y lo medimos cada semana — no son videos que miras solo']. ¿Eso responde de verdad a tu preocupación, o falta algo?"

No pases a la propuesta hasta que confirme que quedó respondido — o te diga que no (entonces lo manejas con la hoja de objeciones, no con la propuesta).

**La prueba de compromiso — reformulada (la prueba de Brian, ajustada):**
> "Antes de mostrarte nada: del 1 al 10 — donde 1 es 'estoy bien como estoy' y 10 es 'estoy listo para hacer el trabajo que haga falta para arreglar ESTO' — ¿dónde estás?"
> "**¿Por qué ese número?**"
> "Y aparte — **¿qué tan convencido estás de que necesitas ayuda de fuera para arreglarlo?** ¿Qué te haría estar más convencido?"

El primer número = disposición a hacer el trabajo. La segunda respuesta = confianza. Tu propuesta tiene que responder a lo que falte en la segunda.

**Pregúntalas como dos momentos separados** — primero la disposición, déjalo terminar, DESPUÉS la de confianza. Juntarlas en una sola respiración borra las dos respuestas (hallazgo de las prácticas v2).

**Transición a la propuesta — usa esta frase, no improvises el puente:**
> "Con eso tengo exactamente lo que necesitaba. Déjame mostrarte cómo lo arreglaríamos…"

**Criterios:**
- **Disposición 8–10:** a la propuesta (Paso 6).
- **Disposición 5–7 o confianza baja:** pregunta qué falta exactamente. Si falta información, la propuesta lo responde — sigue. Si de verdad es "ahora no", no des precio — ofrece la comunidad y agenda un seguimiento.
- **Menos de 5:** descarta con amabilidad: "Con eso claro, los programas pagos no son lo indicado todavía. Mantente cerca con la guía gratuita y la comunidad — cuando esto sea un 9 o un 10 para ti, aquí estamos." Cierra en buenos términos.

## Paso 6 — Presentar la transformación (22:00–26:00)

Las diapositivas suben SOLO ahora (nunca durante el descubrimiento). Completa la plantilla — listas de características, jamás:

> "Esta es la imagen que me diste. Hoy: [su dolor, con sus palabras]. En seis meses quieres [su meta, con sus palabras]. Lo que separa una cosa de la otra es [su restricción]."
> "Entonces, lo PRIMERO que haríamos — en las primeras cuatro a seis semanas — es **[una primera intervención concreta, en su tipo de negocio]**."
> Forma de ejemplo: "En tu caso eso significa reconstruir cómo se les da seguimiento a los prospectos: [quién hace qué — 'tú traes tu lista, construimos la secuencia de seguimiento contigo en las llamadas de trabajo, y tu equipo la corre']. **Sabrás que está funcionando cuando [la medida — por ejemplo: 'cada prospecto nuevo reciba cinco contactos en siete días, y lo puedas ver en el registro de prospectos'].**"
> "Ese es el paso uno. El programa que lo rodea es implementación y responsabilidad compartida en ventas, marketing, contenido, sistemas e IA — en ese orden, guiado por tu restricción, no un curso que miras solo."

**El "por qué esto encaja con TU situación" va ANTES de cualquier comparación de precios:**
> "La razón por la que te pongo frente a [Accelerator] específicamente es [su situación: la restricción, el apoyo que dijo necesitar, el plazo que te dio]."

**Una sola recomendación, según la NECESIDAD DE APOYO (nunca según el número de compromiso):**
- **Accelerator — 5,499 dólares en total, 6 meses.** La opción por defecto para un dueño calificado: implementación + responsabilidad compartida, llamadas de trabajo en grupo, su trabajo revisado.
- **Elite — 9,950 dólares en total, 12 meses.** Para el dueño cuya situación pide el nivel más alto de acceso y acompañamiento directo durante un año completo. Preséntalo solo cuando la necesidad de apoyo de verdad esté ahí.
- **La comunidad The Cartel en Skool — 197 dólares al mes.** La vía de arranque: "Ideal para explorar el marco de trabajo antes de comprometerte con la implementación." Solo como bajada — nunca como propuesta principal a un dueño calificado.

**Di el precio limpio, total primero, y luego CALLA:**
> "Para ti, es el Accelerator — 5,499 dólares en total, por seis meses de implementación con nosotros. [PAUSA. Deja que reaccione primero.]"

**Solo después de su primera reacción**, si el dinero es la fricción, el cálculo diario es el respaldo — nunca la apertura:
> "Compáralo con el otro número: me dijiste que seguir trabado te está costando [su costo del Paso 1]. El Accelerator sale a unos 30 dólares al día durante los seis meses — y a diferencia de la fuga, ese gasto se termina cuando termina el programa."

## Paso 7 — Condiciones y financiamiento (26:00–28:00)

> "Hay dos formas de empezar: pago completo hoy, o — si el flujo de caja es la restricción real — trabajamos con un socio de financiamiento. Quien califique puede dividirlo en pagos mensuales; antes de aceptar cualquier cosa vas a ver el pago mensual, el total y la tasa, y la precalificación es una consulta suave — no afecta tu crédito. No te puedo prometer una aprobación — nadie honesto puede — pero vas a saber exactamente en qué punto estás antes de comprometerte con nada."

Si pregunta por plazos, inclínate por un plazo más cercano a la duración del programa. *[Nota para el equipo: cita las condiciones de financiamiento solo desde el enlace de inscripción vigente — confirma con Alejandro que está activo antes de tus primeras llamadas. Nunca cites una cifra mensual ni una tasa que no esté en el enlace.]*

**Si ÉL menciona su crédito, usa esta frase tal cual — dignidad, cero promesas:**
> "Te agradezco que me lo digas directo. Esto sí te lo prometo: nadie aquí te dice que estás aprobado antes de que el socio lo revise de verdad — y esa revisión es una consulta suave, preguntar no afecta tu crédito. Sea cual sea la respuesta, la manejamos con honestidad desde ahí."

**Cierra la inscripción en la llamada.** Banco completo de objeciones: la Guía de objeciones — diagnostica primero con la pregunta; nunca rebatas, nunca vuelvas a las preguntas de dolor para presionar, nunca uses su número de compromiso en su contra.

## Paso 8 — Cierre: un siguiente paso con fecha, reservado en la llamada (28:00–30:00)

**Si dice que sí:** completa la inscripción/el pago en la llamada, confirma su correo en voz alta y di exactamente qué sigue: "Te llega un correo de confirmación, y en un día hábil tus datos de incorporación. Tu primer paso va a ser [la primera intervención del Paso 6]."

**Si hay otra persona en la decisión (del Paso 0):** nunca lo mandes a "venderlo en casa". Reserva la llamada corta entre los tres antes de colgar y dale algo para compartir: "Agendemos una llamada corta con [pareja/socio] — [día/hora] — para que lo escuche de nosotros, no de segunda mano. Y te mando un resumen de una página para que se lo muestres esta noche."

**Si todavía no:** reserva el seguimiento en Calendly antes de colgar. Nunca termines con un "te mando un correo".

## Después de la llamada — el mismo día, dos acciones

1. **Resumen espejo (el mismo día, correo o mensaje):** sus palabras de vuelta, sin vender nada — "Dijiste que hoy [dolor], y que la meta es [meta]. [La primera intervención] es por donde empezaríamos. Siguiente paso: [fecha/hora reservada]." Corto, rápido, en su idioma.
2. **Regístralo:** resultado/etapa (Captado → Contactado → Interesado → Agendado → Cerrado), número de disposición, respuesta de confianza, sus palabras exactas de dolor y meta, cualquier objeción anotada y cómo se respondió, y el siguiente paso reservado. El próximo que toque a este prospecto necesita todo eso.

---

## RUTA CORTA — cuando el descubrimiento se alarga o la llamada es breve

Si vas en el minuto 15 y no pasaste el Paso 3, corta a este orden y no te saltes la propuesta:

1. Ejemplo reciente + su costo en dólares (Paso 1)
2. "¿Qué pasa si no cambia nada?" (Paso 3)
3. "¿Por qué no has podido lograrlo solo?" (Paso 3)
4. "¿Qué te hizo reservar esta llamada justo ahora?" (Paso 4)
5. Preguntas de disposición + confianza (Paso 5) → plantilla de propuesta (Paso 6) → siguiente paso con fecha (Paso 8)

Un descubrimiento que nunca llega a la propuesta no le sirve a nadie — ni a él, ni a ti.

---

### Hoja resumen de una pantalla (v2)
0. **Preparación** — Su restricción con SUS palabras, escrita antes de marcar. Sin negocio = derivación, sin propuesta.
1. **Encuadre + calificación** — ¿Te parece justo? → ¿Quién más participa en la decisión?
2. **Dolor (máx. 4)** — ¿Con qué batallas? ¿Desde cuándo? ¿Ejemplo reciente + costo? ¿Qué intentaste — por qué falló? Escepticismo → anótalo y promete el regreso.
3. **Meta (máx. 3)** — ¿Cómo se sentiría resuelto? De aquí a seis meses, ¿un día normal?
4. **Brecha** — Resumen UNA vez, con sus palabras. ¿Si no cambia nada…? ¿Solo, por qué no?
5. **Urgencia (1)** — ¿Qué te hizo reservar ESTA llamada ahora?
6. **Regreso + compromiso** — Responde PRIMERO lo anotado. Disposición 1–10 (el trabajo) + pregunta de confianza. Nunca uses los números como presión.
7. **Propuesta** — Plantilla: sus palabras → UNA primera intervención → quién hace qué → la medida. Encaje antes que precio. Precio total, y silencio.
8. **Condiciones** — Financiamiento después de la primera reacción al precio; mensual + total + tasa juntos; aprobaciones jamás prometidas.
9. **Cierre** — Siguiente paso con fecha, reservado en la llamada. Co-decisor = llamada entre tres + resumen para compartir.
10. **Después** — Resumen espejo el mismo día + registro completo.

*Fuente: marco y preguntas centrales del reel de ventas de Brian Mark (octubre 2026); estructura v2 calificada contra los hallazgos de las prácticas, 31 de octubre de 2026. Manejo de objeciones: la Guía de objeciones.*

<script type="text/plain" id="md-cheat-en">
# The Cashflow Cartel — Objection Cheat Sheet (Master, EN)

Discovery call reference · One decision or one booked next step, every time.

**The rule behind every response:** An objection is an unanswered question, not a rejection. Diagnose first with one question, then respond in the prospect's own words. Never use their commitment number as leverage. Never argue. If they give a clear no, accept it cleanly.

**Prices (say the total first, always):** Accelerator $5,499 total / 6 months · Elite $9,950 total / 12 months · Community $197/month.
**Daily framing (secondary only):** $5,499 over six months averages about $30 a day. Use it once, after the total, and only next to the cost of staying stuck that THEY stated. Never lead with it. Never use it when the cash problem is real — go to financing.
**Financing note for the team:** Do not quote financing terms, monthly amounts, or approval odds until the enrollment link is confirmed live. The provider decides approval. Never promise an outcome.

---

## 1. "It's too much / that's a lot of money"
- **Usually means:** The value isn't clear yet, or they're comparing the price to their bank account instead of to the cost of staying stuck.
- **Diagnose:** "Compared to what?" — or: "Is it more than you expected, or are you not sure yet what you'd get back?"
- **Respond:** "You told me staying stuck is costing you [their stated cost]. Put the two numbers next to each other — which one is bigger over the next six months?" / "Let's go back through exactly what's included for [their priority], and you tell me where the value feels light."
- **Bridge:** "If the value made sense, is there anything else that would keep you from starting?"

## 2. "I can't afford it right now" / cash-flow timing
- **Usually means:** Either the cash genuinely isn't there, or the timing of the payment is the problem. Those are different conversations.
- **Diagnose:** "Is this a timing thing or a math thing — the money exists but it's tied up, or it genuinely isn't there right now?"
- **Respond:** If paying would strain payroll or essentials, say so plainly: "Then we pause — this has to be funded without putting the business at risk." If it's timing: "If it's timing, we can look at the verified payment options, or set a date right after [their cash event] to revisit with real numbers."
- **Bridge:** "Want to look at the actual monthly math together, or book [day/time] after that cash event?"

## 3. "I need to talk to my spouse / partner"
- **Usually means:** A genuinely shared decision (respect it), or their own hesitation wearing a partner's name.
- **Diagnose:** "What do you think they'll ask you — and what do you think your answer will be?"
- **Respond:** "That makes sense — it's a real decision. Let's answer their likely questions right now, while you have me, so you're not relaying half the information later." Arm them with a short recap they can share.
- **Bridge:** Book a short three-way call before you hang up: "Mornings or afternoons — what works better for the two of them and you?"

## 4. "I need to think about it"
- **Usually means:** One specific question is still unanswered — about fit, risk, or cost. "Thinking" is the holding pattern, not the obstacle.
- **Diagnose:** "Before you go — what specifically would you need to get clear on for this to be a yes?"
- **Respond:** "Fair. In my experience there's usually one thing still open. Let's name it and deal with that one thing directly." Then deal only with what they name.
- **Bridge:** "Let's book [48 hours out] to land on a yes or a no — either answer is fine. I'd rather have clarity than a maybe."

## 5. "Bad timing / not right now"
- **Usually means:** The comfort of the current situation is temporarily beating the discomfort they described — or there's a real external constraint they haven't named.
- **Diagnose:** "What would need to be different for the timing to be right?"
- **Respond:** "The constraint you described doesn't get cheaper with time — it compounds. If we meet again in six months, will the problem be the same one?" If the constraint is real (a deadline, a season), respect it and work around it honestly.
- **Bridge:** "If not now, let's lock a date tied to [their named event] so this doesn't just drift."

## 6. "I got burned before — how is this different?"
- **Usually means:** They bought information before and got no result. They're protecting themselves, not attacking you.
- **Diagnose:** "What did you invest in, and what specifically didn't happen that was supposed to?"
- **Respond:** "What you're describing is the difference between a course and implementation. We don't hand you information and leave — we work the one constraint with you until the fix is running in the business." Then compare the scope, responsibilities, and written terms side by side with what failed them.
- **Bridge:** "What would you need to see in the first 30 days to know this is different? Name it, and I'll tell you honestly whether we can deliver it."

## 7. "Just send me the information"
- **Usually means:** They want to end the call without saying no — or they're a genuine reader who decides on paper.
- **Diagnose:** "What would you be looking for in it that we haven't covered?"
- **Respond:** "I'll send a short recap built around [their constraint], with the scope and the total price — not a generic deck. The one thing paper can't do is match the plan to what you told me today."
- **Bridge:** Send the recap AND book it: "Let's put 15 minutes on [day] to go through it together — or if you'd rather reach out yourself, that's fine too."

## 8. "I'll figure it out myself / DIY"
- **Usually means:** They believe effort is the missing ingredient. They haven't yet connected the problem to structure or accountability.
- **Diagnose:** "You've been working on [their constraint] for [their timeframe]. What's been the main thing stopping you from solving it on your own so far?"
- **Respond:** "That's not a knock on your effort — it usually means the missing piece isn't more trying. It's a different angle, from someone who can see what you can't see from inside it, plus someone holding the line while you run the business."
- **Bridge:** "If you run your plan and you're in the same place in six months, can we at least book a check-in for then?"

## 9. "My credit isn't great — I probably won't qualify"
- **Usually means:** Real financial anxiety, often with shame attached. Zero pressure here — pushing costs the relationship permanently.
- **Diagnose:** "Are you worried about the approval itself, the credit check, or taking on the payments?"
- **Respond:** "The provider decides approval — I won't guess at it. Before anything, we'll confirm exactly how their check works and what it does to your score. And we'd review the rate, the fees, and the total you'd repay before you accept anything."
- **Bridge:** "Want the verified details first, and then we look at them together on [day/time]?" If they decline, respect it immediately and offer the Community as a genuine starting point, not a consolation.

## 10. "I'm not ready / my business is too small"
- **Usually means:** They don't believe someone at their stage belongs — or size is a shield for a risk concern they haven't said out loud.
- **Diagnose:** "What does 'ready' look like — what would need to be true about the business?"
- **Respond:** "Size alone doesn't decide fit. The problem and your capacity to act on it do. The owners who get the most from this are close but stuck — not already figured out." If they genuinely have no operating business yet, say so plainly: "Then this mentorship isn't your next step yet."
- **Bridge:** "Give me the milestone — a number or a month — and let's decide together if it's a real threshold, then book the revisit for when you hit it."

---

## One-line version

| # | Objection | Real meaning | Diagnose with |
|---|---|---|---|
| 1 | Too much | Value hasn't landed | "Compared to what?" |
| 2 | Can't afford | Timing, or the money isn't there | "Timing thing, or math thing?" |
| 3 | Talk to spouse | Shared decision or proxy hesitation | "What will they ask you?" |
| 4 | Think about it | One unnamed question | "What would make this a yes?" |
| 5 | Bad timing | Status quo is winning | "What would need to change?" |
| 6 | Burned before | Fear of a repeat | "What didn't happen that was supposed to?" |
| 7 | Send me info | Wants out without a no | "What would you look for in it?" |
| 8 | DIY | Wrong diagnosis of the gap | "What's stopped you solving it solo?" |
| 9 | Credit worry | Approval anxiety | "Approval, the check, or the payments?" |
| 10 | Not ready / too small | Stage used as a shield | "What does ready actually look like?" |

**The override rule:** If they can't answer the diagnostic question, the silence isn't a no — it's the real issue surfacing. Let it breathe. The decision lives in that pause.

*Master sheet for Training Module 4.*

<script type="text/plain" id="md-cheat-es">
# The Cashflow Cartel — Guía de objeciones (Master, ES)

Referencia para la llamada de descubrimiento · Una decisión o un siguiente paso agendado. Siempre.

**La regla detrás de cada respuesta:** Una objeción no es un rechazo — es una pregunta sin respuesta. Primero diagnostica con una pregunta, luego responde con las palabras del prospecto. Nunca uses su número de compromiso como palanca. Nunca rebatas. Si te da un no claro, acéptalo limpio.

**Precios (di siempre primero el total):** Accelerator $5,499 dólares en total / 6 meses · Elite $9,950 dólares en total / 12 meses · Comunidad $197 al mes.
**Marco diario (solo secundario):** $5,499 en seis meses sale a unos $30 al día. Úsalo una sola vez, después del total, y solo junto al costo de seguir trabado que ELLOS mismos nombraron. Nunca abras con eso. Y si el problema de dinero es real, no lo uses — ve directo al financiamiento.
**Nota de financiamiento para el equipo:** No menciones términos, mensualidades ni probabilidades de aprobación hasta que el enlace de financiamiento esté confirmado activo. La aprobación la decide el proveedor. Nunca prometas un resultado.

---

## 1. "Es mucho dinero / está muy caro"
- **Lo que suele significar:** Todavía no ve claro el valor, o está comparando el precio con su cuenta de banco y no con lo que le cuesta seguir trabado.
- **Diagnostica:** "¿Caro comparado con qué?" — o: "¿Es más de lo que esperabas, o todavía no tienes claro qué te llevarías a cambio?"
- **Responde:** "Me dijiste que seguir así te está costando [su costo]. Pon los dos números lado a lado — ¿cuál es más grande en los próximos seis meses?" / "Repasemos exactamente qué incluye para [su prioridad], y tú me dices dónde sientes que el valor cojea."
- **Puente:** "Si el valor tuviera sentido, ¿habría algo más que te impidiera empezar?"

## 2. "No me alcanza / no tengo el flujo ahorita"
- **Lo que suele significar:** O el dinero de verdad no está, o el problema es el momento del pago. Son dos conversaciones distintas.
- **Diagnostica:** "¿Es un tema de tiempo o de matemáticas? O sea, ¿el dinero existe pero está comprometido, o de plano no está disponible ahorita?"
- **Responde:** Si pagar afectaría la nómina o lo esencial, dilo claro: "Entonces pausamos — esto se tiene que pagar sin poner el negocio en riesgo." Si es tiempo: "Si es cuestión de tiempo, revisamos las opciones de pago verificadas, o agendamos justo después de [su evento de ingreso] para verlo con números reales."
- **Puente:** "¿Revisamos juntos cuánto sería al mes, o agendamos para [día/hora] después de ese ingreso?"

## 3. "Necesito hablarlo con mi pareja / socio"
- **Lo que suele significar:** Una decisión genuinamente compartida (respétalo), o su propia duda con el nombre de otra persona.
- **Diagnostica:** "¿Qué crees que te van a preguntar — y qué crees que les vas a responder?"
- **Responde:** "Tiene todo el sentido — es una decisión real. Respondamos ahorita las preguntas que te van a hacer, mientras me tienes en la línea, para que no llegues con la información a medias." Y entrégale un resumen corto que pueda compartir.
- **Puente:** Agenda la llamada entre los tres antes de colgar: "¿Qué les queda mejor, en la mañana o en la tarde?"

## 4. "Necesito pensarlo"
- **Lo que suele significar:** Hay una pregunta concreta sin respuesta — sobre si encaja, el riesgo o el costo. "Pensarlo" es la sala de espera, no el obstáculo.
- **Diagnostica:** "Antes de que te vayas — ¿qué necesitarías tener claro para que esto sea un sí?"
- **Responde:** "Claro, lo entiendo. Casi siempre hay una sola cosa que sigue abierta. Nombrémosla y la resolvemos directo." Y trabaja solo lo que nombre.
- **Puente:** "Agendemos para [48 horas] y ahí aterrizamos en un sí o un no — las dos respuestas están bien. Prefiero claridad a un quizás."

## 5. "No es buen momento / ahorita no"
- **Lo que suele significar:** La comodidad de cómo están las cosas le está ganando por ahora al malestar que describió — o hay una limitación real que no ha nombrado.
- **Diagnostica:** "¿Qué tendría que ser diferente para que el momento sí fuera el indicado?"
- **Responde:** "Lo que me describiste no sale más barato con el tiempo — se acumula. Si hablamos en seis meses, ¿el problema va a ser el mismo?" Si la limitación es real (una fecha, una temporada), respétala y trabaja alrededor con honestidad.
- **Puente:** "Si ahorita no, dejemos una fecha amarrada a [su evento] para que esto no se pierda en el aire."

## 6. "Ya me quemé antes / ¿en qué es diferente esto?"
- **Lo que suele significar:** Ya pagó por información antes y no vio resultados. Se está protegiendo, no te está atacando.
- **Diagnostica:** "¿En qué invertiste, y qué fue exactamente lo que no pasó y se suponía que iba a pasar?"
- **Responde:** "Lo que describes es la diferencia entre un curso y la implementación. Nosotros no te entregamos información y te soltamos — trabajamos contigo la única restricción que te está trabando hasta que la solución está corriendo en tu negocio." Y compara alcance, responsabilidades y términos escritos contra lo que le falló.
- **Puente:** "¿Qué necesitarías ver en los primeros 30 días para saber que esto sí es diferente? Nómbralo y te digo con honestidad si lo podemos cumplir."

## 7. "Mándame la información"
- **Lo que suele significar:** Quiere salir de la llamada sin decir que no — o de verdad decide mejor leyendo con calma.
- **Diagnostica:** "¿Qué estarías buscando en esa información que no hayamos cubierto ya?"
- **Responde:** "Te mando un resumen corto armado alrededor de [su restricción], con el alcance y el precio total — no un material genérico. Lo único que el papel no puede hacer es ajustar el plan a lo que me contaste hoy."
- **Puente:** Manda el resumen Y agenda: "Dejemos 15 minutos el [día] para revisarlo juntos — o si prefieres escribirme tú cuando lo veas, también está bien."

## 8. "Yo lo resuelvo solo / lo hago por mi cuenta"
- **Lo que suele significar:** Cree que lo que falta es esfuerzo. Todavía no conecta el problema con estructura ni con rendición de cuentas.
- **Diagnostica:** "Llevas [su tiempo] lidiando con [su restricción]. ¿Qué ha sido lo que más te ha frenado para resolverlo por tu cuenta hasta ahorita?"
- **Responde:** "Y no es un golpe a tu esfuerzo — normalmente significa que lo que falta no es intentarlo más fuerte. Es otro ángulo, de alguien que ve lo que no se ve desde adentro, y alguien que sostiene el plan mientras tú operas el negocio."
- **Puente:** "Si corres tu plan y en seis meses sigues en el mismo lugar, ¿agendamos de una vez un punto de contacto para entonces?"

## 9. "Mi crédito no está bien / no creo que califique"
- **Lo que suele significar:** Ansiedad financiera real, muchas veces con pena. Aquí, cero presión — empujar te cuesta la relación para siempre.
- **Diagnostica:** "¿Te preocupa la aprobación en sí, la revisión de crédito, o cargar con los pagos?"
- **Responde:** "La aprobación la decide el proveedor — yo no te voy a adivinar eso. Antes de cualquier cosa, confirmamos exactamente cómo funciona su revisión y si afecta tu score. Y revisamos la tasa, los cargos y el total que pagarías antes de que aceptes nada."
- **Puente:** "¿Quieres primero los detalles verificados y los revisamos juntos el [día/hora]?" Si dice que no, respétalo de inmediato y ofrécele la Comunidad como un punto de partida real, no como premio de consolación.

## 10. "No estoy listo / mi negocio es muy chico"
- **Lo que suele significar:** Todavía no cree que alguien en su etapa pertenece aquí — o el tamaño es un escudo para un riesgo que no ha dicho en voz alta.
- **Diagnostica:** "¿Cómo se ve 'listo' para ti? ¿Qué tendría que ser verdad en tu negocio?"
- **Responde:** "El tamaño por sí solo no decide si encaja. Lo deciden el problema y tu capacidad de actuar sobre él. Los que más provecho sacan son los que están cerca pero trabados — no los que ya lo tienen todo resuelto." Y si de verdad todavía no tiene un negocio operando, dilo claro: "Entonces esta mentoría todavía no es tu siguiente paso."
- **Puente:** "Dame la meta — un número o un mes — y decidimos juntos si es un umbral real; agendamos la retomada para cuando lo alcances."

---

## La guía en una línea por objeción

| # | Objeción | Significado real | Diagnostica con |
|---|---|---|---|
| 1 | Muy caro | El valor no ha aterrizado | "¿Caro comparado con qué?" |
| 2 | No me alcanza | ¿Tiempo o matemáticas? | "¿El dinero existe o de plano no está?" |
| 3 | Hablar con pareja | Decisión compartida o duda propia | "¿Qué crees que te van a preguntar?" |
| 4 | Necesito pensarlo | Una pregunta sin nombre | "¿Qué necesitarías para que sea un sí?" |
| 5 | No es buen momento | El statu quo está ganando | "¿Qué tendría que cambiar?" |
| 6 | Ya me quemé | Miedo a repetir el dolor | "¿Qué no pasó y se suponía que iba a pasar?" |
| 7 | Mándame info | Quiere salir sin decir no | "¿Qué buscarías que no cubrimos?" |
| 8 | Lo hago solo | Diagnóstico equivocado del hueco | "¿Qué te ha frenado para resolverlo solo?" |
| 9 | Mi crédito no está bien | Ansiedad por la aprobación | "¿La aprobación, la revisión o los pagos?" |
| 10 | No estoy listo / soy chico | La etapa como escudo | "¿Cómo se ve 'listo' para ti?" |

**La regla que está por encima de todo:** Si no puede responder la pregunta de diagnóstico, el silencio no es un no — es el problema real saliendo a la superficie. Déjalo respirar. La decisión vive en esa pausa.

*Hoja master para el Módulo 4 del entrenamiento.*
</script>

    t=esc(t);

    t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");

  }
  function closeBlocks(){ if(inList){out.push("</ul>");inList=false;} if(inQuote){out.push("</blockquote>");inQuote=false;} if(inTable){out.push("</tbody></table>");inTable=false;} }
  while(i<lines.length){
    var ln=lines[i];

      for(j=0;j<cells.length;j++){ row+="<td>"+inline(cells[j].trim())+"</td>"; }

    if(/^>\s?/.test(ln)){
      if(!inQuote){ if(inList){out.push("</ul>");inList=false;} out.push("<blockquote>"); inQuote=true; }
      out.push("<p>"+inline(ln.replace(/^>\s?/,""))+"</p>"); i++; continue;
    }

    var m;

    if(/^\s*---\s*$/.test(ln)){ if(inList){out.push("</ul>");inList=false;} out.push("<hr>"); i++; continue; }
    if(m=ln.match(/^\s*[-*]\s+(.*)/)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+inline(m[1])+"</li>"); i++; continue; }

}

<script>
/* ============ generic quiz ============ */
/* questions: [{q, opts:[], ans, why}] — renders stacked, instant feedback */
function quizHtml(qs, prefix){
  var h="";
  for(var i=0;i<qs.length;i++){
    var q=qs[i];
    h+='<div class="card" id="'+prefix+'-q'+i+'"><p><b>'+(i+1)+'. '+esc(q.q)+'</b></p>';
    for(var j=0;j<q.opts.length;j++){
      h+='<button class="opt" onclick="quizPick(\''+prefix+'\','+i+','+j+')">'+esc(q.opts[j])+'</button>';
    }
    h+='<div class="fb hidden" id="'+prefix+'-fb'+i+'"></div></div>';
  }
  h+='<div class="card gold hidden" id="'+prefix+'-sum"></div>';
  return h;
}
var QUIZSTATE={};
function quizInit(prefix, qs){ QUIZSTATE[prefix]={qs:qs, picked:{}, right:0, done:false}; }
function quizPick(prefix, qi, oi){
  var st=QUIZSTATE[prefix]; if(!st||st.done) return;
  if(st.picked[qi]!==undefined) return;
  var q=st.qs[qi]; st.picked[qi]=oi;
  var card=$ (prefix+"-q"+qi); var btns=card.getElementsByClassName("opt");
  for(var b=0;b<btns.length;b++){ btns[b].disabled=true; if(b===q.ans) btns[b].className="opt right"; else if(b===oi) btns[b].className="opt wrong"; }
  var ok = oi===q.ans; if(ok) st.right++;
  var fb=$(prefix+"-fb"+qi); fb.className="fb "+(ok?"ok":"no"); fb.innerHTML=(ok?"✓ ":"✗ ")+esc(q.why);
  if(Object.keys(st.picked).length===st.qs.length){
    st.done=true;
    var pct=Math.round(st.right/st.qs.length*100);
    var sum=$(prefix+"-sum"); sum.className="card gold";
    sum.innerHTML="<b>"+T("yourScore")+": "+st.right+"/"+st.qs.length+" ("+pct+"%)</b>";
    if(st.onDone) st.onDone(pct);
  }
}

    ["1 · PAIN","Find what it's actually costing. A named pain with a recent example and a dollar cost is something a prospect can decide about. A vague complaint is not."],
    ["2 · GOAL","The solved picture, in their words — what it feels like, who else benefits, what a normal day looks like in six months. Your pitch is built out of this picture, never out of a feature list."],
    ["3 · GAP","Put today and the goal side by side, mirror it once in their exact words, then ask what happens if nothing changes. The gap creates the decision. Most losses are not to price or a competitor — they're to no decision at all."],
    ["4 · URGENCY","One question: what made you book this call now? If there's no real \"now,\" there's no decision today. One question, one follow-up at most — repeating it reads as pressure."],
    ["5 · COMMITMENT","Two measurements before any pitch: readiness to do the work, and trust that outside help gets them there. Asked as two separate beats. The trust answer tells you what the pitch must prove."],
    ["6 · PITCH","The transformation in their words: one specific first intervention, who does what, how they'll know it's working. Fit before price. Price total first — then silence."]
  ] : [
    ["1 · DOLOR","Encuentra cuánto le está costando de verdad. Un dolor con nombre, un ejemplo reciente y un costo en dólares es algo sobre lo que se puede decidir. Una queja vaga, no."],
    ["2 · META","La imagen resuelta, con sus palabras: cómo se siente, quién más gana, cómo se ve un día normal en seis meses. Tu propuesta se construye con esa imagen, nunca con una lista de características."],
    ["3 · BRECHA","Pon el hoy y la meta lado a lado, haz el espejo una sola vez con sus palabras exactas, y pregunta qué pasa si no cambia nada. La brecha crea la decisión. La mayoría de las pérdidas no son por precio ni por un competidor: son por falta de decisión."],
    ["4 · URGENCIA","Una pregunta: ¿qué te hizo reservar esta llamada justo ahora? Si no hay un «ahora» real, hoy no hay decisión. Una pregunta y un solo seguimiento: repetirla se siente como presión."],
    ["5 · COMPROMISO","Dos mediciones antes de cualquier propuesta: disposición a hacer el trabajo, y confianza en que la ayuda de fuera lo lleva ahí. Preguntadas como dos momentos separados. La respuesta de confianza te dice qué tiene que probar tu propuesta."],
    ["6 · PROPUESTA","La transformación con sus palabras: una primera intervención concreta, quién hace qué, cómo sabrá que funciona. Encaje antes que precio. Precio total primero — y silencio."]
  ];
  var rules = en ? ["They talk ~55–60% of the call. You ask, listen, take notes.","Objections are diagnosed with a question — never rebutted.","Mirror once, at the Step 3 summary, in their exact words.","Never use their commitment number as leverage. Ever.","Discovery runs on a clock: question budgets per step and a compression path. A call that never reaches the pitch helps nobody.","Skepticism raised early gets parked — and the park is a promise you pay off before the pitch."]
   : ["Ellos hablan ~55–60% de la llamada. Tú preguntas, escuchas y anotas.","Las objeciones se diagnostican con una pregunta — nunca se rebaten.","Espejo una sola vez, en el Paso 3, con sus palabras exactas.","Nunca uses su número de compromiso como palanca. Nunca.","El descubrimiento tiene reloj: límites de preguntas por paso y ruta corta. Una llamada que nunca llega a la propuesta no le sirve a nadie.","El escepticismo temprano se anota — y esa anotación es una promesa que se cumple antes de la propuesta."];
  var h='<button class="btn ghost" onclick="go(\'home\')">'+T("backHome")+'</button><h1>'+T("m1t")+'</h1>';
  h+='<div class="card"><p>'+(en?"The sequence is Brian Mark's, and the order is the point: <b>Pain → Goal → Gap → Urgency → Commitment → Pitch.</b> Each gate exists because skipping it kills calls in a predictable way. His rule runs the whole thing:":"La secuencia es de Brian Mark, y el orden es el punto: <b>Dolor → Meta → Brecha → Urgencia → Compromiso → Propuesta.</b> Cada puerta existe porque saltarla mata llamadas de una forma predecible. Su regla manda en todo:")+'</p><blockquote style="margin:10px 0;padding:10px 12px;background:#101010;border-left:3px solid var(--gold)"><p>'+(en?"\"Nobody cares about your product. Nobody cares about you. They only care about themselves. Your only job is to figure out them — and whether you can get them to their goals.\"":"«A nadie le importa tu producto ni le importas tú. Solo les importa ellos mismos. Tu único trabajo es entenderlos — y saber si puedes llevarlos a su meta.»")+'</p></blockquote></div>';
  for(var i=0;i<gates.length;i++){ h+='<div class="card"><h3 style="margin-top:0;color:var(--gold)">'+gates[i][0]+'</h3><p>'+gates[i][1]+'</p></div>'; }
  h+='<div class="card"><h3 style="margin-top:0">'+(en?"Rules that run every call":"Reglas que mandan en cada llamada")+'</h3><ul>';
  for(var r=0;r<rules.length;r++) h+='<li>'+rules[r]+'</li>';
  h+='</ul></div><h2>'+(en?"Check — 5 questions":"Revisión — 5 preguntas")+'</h2>'+quizHtml(M1Q[LANG],"m1q");
  V.innerHTML=h; quizInit("m1q",M1Q[LANG]); QUIZSTATE["m1q"].onDone=function(){ markDone("m1"); };
}

 {q:"Still minute 2, before pain — what else has to be asked?",opts:["His annual revenue.","Who else is part of a decision like this for him.","Whether he's bought coaching before."],ans:1,why:"The co-decider question goes at minute 2. It decides how you close, and it must never arrive as an ambush at minute 28."},

],

 {q:"Paso 1: él solo, sin que preguntes, menciona que el estrés le está pegando en casa. Tú…",opts:["Haces la pregunta de impacto personal de todos modos, para correr el guion completo.","No la vuelves a preguntar: ya llegó solo a ese tema.","Le devuelves toda su respuesta en espejo antes de seguir."],ans:1,why:"Preguntar lo que ya respondió delata la técnica y rompe la confianza. Anótalo y sigue."},

 {q:"Paso 4: su respuesta a «¿qué te hizo reservar esta llamada justo ahora?» es floja. Tú…",opts:["Preguntas dos versiones más del por qué ahora hasta que aterrice.","Haces UN solo seguimiento: «¿Qué pasa si le das otros seis meses más?»","Saltas la urgencia y vas al compromiso."],ans:1,why:"Una pregunta y un seguimiento. Tres versiones de lo mismo se sienten como presión y cuestan confianza."},

function splitSteps(md){
  var parts=md.split(/\n(?=#{2,3}\s)/), out=[];
  for(var i=0;i<parts.length;i++){ var t=parts[i].trim(); if(t) out.push(t); }
  return out;
}
var M2CUR=0;
function renderM2(V){
  var en=LANG==="en";
  var chunks=splitSteps(mdText(en?"md-script-en":"md-script-es"));
  M2CUR=0;
  var h='<button class="btn ghost" onclick="go(\'home\')">'+T("backHome")+'</button><h1>'+T("m2t")+'</h1>';
  h+='<p class="dim small">'+(en?"The complete script, section by section. The wording is the standard — study it verbatim, then check yourself on the decisions after it.":"El guion completo, sección por sección. La redacción es el estándar: estúdialo tal cual, y luego revisa tus decisiones.")+'</p>';
  h+='<div class="stepnav" id="m2nav">';
  for(var i=0;i<chunks.length;i++){ var title=chunks[i].split("\n")[0].replace(/^#{2,3}\s*/,""); h+='<button data-step="'+i+'" onclick="m2show('+i+')">'+esc(title.length>34?title.substring(0,34)+"…":title)+'</button>'; }
  h+='</div><div class="card md" id="m2body"></div>';
  h+='<h2>'+T("checkQ")+'s</h2>'+quizHtml(M2Q[LANG],"m2q");
  V.innerHTML=h; quizInit("m2q",M2Q[LANG]); QUIZSTATE["m2q"].onDone=function(){ markDone("m2"); };
  window._m2chunks=chunks; m2show(0);
}
function m2show(i){
  M2CUR=i; var nav=$("m2nav").getElementsByTagName("button");
  for(var b=0;b<nav.length;b++) nav[b].className = (b===i)?"on":"";
  $("m2body").innerHTML=mdToHtml(window._m2chunks[i]);
  var h='<div style="display:flex;gap:8px;margin-top:10px">';
  if(i>0) h+='<button class="btn ghost" onclick="m2show('+(i-1)+')">←</button>';
  if(i<window._m2chunks.length-1) h+='<button class="btn" style="flex:1" onclick="m2show('+(i+1)+')">'+(LANG==="es"?"Siguiente sección →":"Next section →")+'</button>';
  $("m2body").innerHTML+=h+'</div>';
}

<script>
/* ============ MODULE 3 ============ */
var PRICE_CARDS={
en:[
 {t:"1 · FIT BEFORE PRICE",b:"\"The reason I'm putting you in front of the Accelerator specifically is your situation: the constraint, the support you said you need, the timeline you gave me.\"",n:"Say it out loud. Fit is always explained before any number exists."},
 {t:"2 · THE PRICE — TOTAL FIRST",b:"\"For you, it's the Accelerator — $5,499 in total, for six months of implementation with us.\"",n:"Total first. Clean. No monthly math, no daily math, no apology."},
 {t:"3 · SILENCE",b:"· · ·",n:"STOP TALKING. Let them react first. The next voice on the call is theirs. Selling into the silence is how price moments die."},
 {t:"4 · THEIR REACTION: \"That's a lot.\"",b:"\"Put against the other number: you told me staying stuck is costing you [their Step 1 cost]. The Accelerator works out to about $30 a day over the six months — and unlike the leak, it stops when the program ends.\"",n:"ONLY now — after their first reaction — the daily reframe is allowed, and only next to the cost THEY stated. If the cash problem is real, skip it and go to financing."},
 {t:"5 · FINANCING — ALL OF IT TOGETHER",b:"\"Two ways to start: pay in full today, or — if cash flow is the real constraint — we work with a financing partner. Qualified buyers can split it into monthly payments; you'd see the monthly amount, the total, and the rate before you agree to anything, and the pre-qualification is a soft check — it doesn't affect your credit. I can't promise an approval — nobody honest can.\"",n:"Monthly + total + rate together. Soft pull explained. Approval never promised. Quote terms only from the live enrollment link."},
 {t:"6 · HE RAISES HIS OWN CREDIT",b:"\"I appreciate you saying that straight. Here's my promise: nobody here tells you you're approved before the partner actually runs it — and the check is a soft pull, so asking doesn't hurt your credit. Whatever the answer comes back, we deal with it honestly from there.\"",n:"Word for word. Dignity, no promises. This line, delivered calmly, is a trust moment — not a problem."}
],
es:[
 {t:"1 · ENCAJE ANTES QUE PRECIO",b:"«La razón por la que te pongo frente al Accelerator específicamente es tu situación: la restricción, el apoyo que dijiste necesitar, el plazo que me diste.»",n:"Dilo en voz alta. El encaje se explica siempre antes de que exista cualquier número."},
 {t:"2 · EL PRECIO — TOTAL PRIMERO",b:"«Para ti, es el Accelerator — 5,499 dólares en total, por seis meses de implementación con nosotros.»",n:"Total primero. Limpio. Sin cuentas mensuales, sin cuentas diarias, sin disculpas."},
 {t:"3 · SILENCIO",b:"· · ·",n:"CALLA. Deja que reaccione primero. La siguiente voz en la llamada es la suya. Vender dentro del silencio es como mueren los momentos de precio."},
 {t:"4 · SU REACCIÓN: «Es mucho.»",b:"«Compáralo con el otro número: me dijiste que seguir trabado te está costando [su costo del Paso 1]. El Accelerator sale a unos 30 dólares al día durante los seis meses — y a diferencia de la fuga, ese gasto se termina cuando termina el programa.»",n:"SOLO ahora — después de su primera reacción — el cálculo diario está permitido, y solo junto al costo que ELLOS nombraron. Si el problema de dinero es real, sáltalo y ve al financiamiento."},
 {t:"5 · FINANCIAMIENTO — TODO JUNTO",b:"«Hay dos formas de empezar: pago completo hoy, o — si el flujo de caja es la restricción real — trabajamos con un socio de financiamiento. Quien califique puede dividirlo en pagos mensuales; antes de aceptar cualquier cosa vas a ver el pago mensual, el total y la tasa, y la precalificación es una consulta suave — no afecta tu crédito. No te puedo prometer una aprobación — nadie honesto puede.»",n:"Mensual + total + tasa juntos. Consulta suave explicada. Aprobación jamás prometida. Cita condiciones solo desde el enlace de inscripción vigente."},
 {t:"6 · ÉL MISMO MENCIONA SU CRÉDITO",b:"«Te agradezco que me lo digas directo. Esto sí te lo prometo: nadie aquí te dice que estás aprobado antes de que el socio lo revise de verdad — y esa revisión es una consulta suave, preguntar no afecta tu crédito. Sea cual sea la respuesta, la manejamos con honestidad desde ahí.»",n:"Tal cual, palabra por palabra. Dignidad, cero promesas. Esta frase, dicha con calma, es un momento de confianza — no un problema."}
]};
var PCIDX=0;
function renderM3(V){

  h+='<p class="dim small">'+(en?"Slides go up ONLY at the pitch — never during discovery. One recommendation, routed by support need, never by the commitment number.":"Las diapositivas suben SOLO en la propuesta — nunca durante el descubrimiento. Una sola recomendación, según la necesidad de apoyo, nunca según el número de compromiso.")+'</p>';
  h+='<div class="grid2">'
   +'<div class="tier hero"><div class="kicker">'+(en?"DEFAULT RECOMMENDATION":"RECOMENDACIÓN POR DEFECTO")+'</div><h3 style="margin:4px 0">Accelerator</h3><div class="pr">$5,499 '+(en?"total":"dólares en total")+'</div><p class="small">'+(en?"6 months · Implementation + accountability, group working calls, their work reviewed. For the qualified owner who needs the fix built with them.":"6 meses · Implementación + responsabilidad compartida, llamadas de trabajo en grupo, su trabajo revisado. Para el dueño calificado que necesita el arreglo construido con él.")+'</p></div>'

   +'<div class="tier"><div class="kicker">'+(en?"STARTER LANE — DOWNSELL ONLY":"VÍA DE ARRANQUE — SOLO COMO BAJADA")+'</div><h3 style="margin:4px 0">'+(en?"Community (Skool)":"Comunidad (Skool)")+'</h3><div class="pr">$197/'+(en?"month":"mes")+'</div><p class="small">'+(en?"For exploring the framework before committing to implementation. Never the lead pitch to a qualified owner.":"Para explorar el marco de trabajo antes de comprometerte con la implementación. Nunca la propuesta principal a un dueño calificado.")+'</p></div>'
   +'<div class="tier"><div class="kicker">'+(en?"THE PRICE RULES":"LAS REGLAS DEL PRECIO")+'</div><ul class="small" style="padding-left:18px;margin:6px 0">'

   +'</ul></div></div>';
  h+='<h2>'+(en?"Price-moment rehearsal":"Ensayo del momento del precio")+'</h2><p class="dim small">'+(en?"Tap through the moment card by card. Say each line out loud before you advance — the way you'd say it on a live call.":"Avanza tarjeta por tarjeta. Di cada frase en voz alta antes de seguir — como la dirías en una llamada real.")+'</p>';
  h+='<div class="card gold" id="pcCard"></div><div style="display:flex;gap:8px"><button class="btn ghost" onclick="pcMove(-1)">←</button><button class="btn" style="flex:1" id="pcNext" onclick="pcMove(1)">'+(en?"Say it, then tap →":"Dilo y toca →")+'</button></div>';
